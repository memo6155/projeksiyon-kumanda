              let lastX = 0, lastY = 0, startX = 0, startY = 0, startTime = 0;
              let accX = 0, accY = 0, timer = null;

              surface.addEventListener('touchstart', (e) => {
                const t = e.touches[0]; lastX = startX = t.clientX; lastY = startY = t.clientY; startTime = Date.now();
              }, { passive: true });

              surface.addEventListener('touchmove', (e) => {
                e.preventDefault(); const t = e.touches[0];
                accX += (t.clientX - lastX) * 1.75; accY += (t.clientY - lastY) * 1.75; lastX = t.clientX; lastY = t.clientY;
