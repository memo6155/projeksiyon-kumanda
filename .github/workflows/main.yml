            <!-- Bluetooth Tarama Modal -->
            <div id="scanModal" class="modal-backdrop">
              <div class="modal">
                <div class="modal-head">
                  <span class="modal-title">Bluetooth Cihaz Seçin</span>
                  <button class="close-x" onclick="closeScanner()">✕</button>
                </div>
                <div id="scanStatus" class="scan-info" style="margin-bottom:8px;">Cihazlar aranıyor...</div>
                <div id="deviceList" class="dev-list"></div>
                <button class="soft-btn" onclick="rescan()">Yeniden Tara</button>
              </div>
            </div>

            <!-- Ekran Filtre Modal -->
            <div id="adjustModal" class="modal-backdrop">
              <div class="modal">
                <div class="modal-head">
                  <span class="modal-title">Ekran Parlaklık & Kontrast Filtresi</span>
                  <button class="close-x" onclick="closeAdjustModal()">✕</button>
                </div>
                <div class="scan-info">
                  Projeksiyon ve ekran için filtre katmanı uygulayın:
                </div>

                <div class="slider-group">
                  <div class="slider-label">
                    <span>Parlaklık (Brightness)</span>
                    <span id="brightVal">100%</span>
                  </div>
                  <input type="range" min="70" max="150" value="100" class="slider-input" id="brightRange" oninput="applyFilters()">
                </div>

                <div class="slider-group">
                  <div class="slider-label">
                    <span>Kontrast (Contrast)</span>
                    <span id="contrastVal">100%</span>
                  </div>
                  <input type="range" min="70" max="160" value="100" class="slider-input" id="contrastRange" oninput="applyFilters()">
                </div>

                <button class="soft-btn" style="width:100%;background:#0284c7;color:#fff;margin-top:4px;" onclick="resetFilters()">Filtreyi Sıfırla</button>
              </div>
            </div>

          <script>
            const foundDevices = {};
            let isConnected = false;
            let gyroEnabled = false;
            let isConnectingFromModal = false;
            let badgeTimer = null;

            const sensLevels = [
              { label: 'Yavaş', val: 14 },
              { label: 'Orta', val: 22 },
              { label: 'Hızlı', val: 32 }
            ];
            let sensIndex = 1;

            function vibrate(ms = 14) {
              if (navigator.vibrate) navigator.vibrate(ms);
            }

            function switchMode(mode) {
              vibrate(14);
              document.getElementById('tabRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('tabTouch').classList.toggle('active', mode === 'touch');
              document.getElementById('panelRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('panelTouch').classList.toggle('active', mode === 'touch');

              if (mode === 'remote') {
                if (gyroEnabled) {
                  gyroEnabled = false;
                  updateGyroUi();
                }
              }
              if (window.AndroidBridge) {
                window.AndroidBridge.releaseAllHid();
                window.AndroidBridge.resetVirtualCursor();
              }
            }

            function triggerHybridPower() {
              vibrate(30);
              if (window.AndroidBridge) {
                window.AndroidBridge.triggerPowerWithIr(0x80, 0x7F, 0x12);
              }
            }

            function tapBack() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendBackKey();
            }

            function tapMenu() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendMenuKey();
            }

            function toggleGyroMouse() {
              gyroEnabled = !gyroEnabled;
              vibrate(22);
              updateGyroUi();
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroEnabled(gyroEnabled);
              }
            }

            function updateGyroUi() {
              const btn = document.getElementById('gyroBtn');
              const txt = document.getElementById('gyroText');
              const ring = document.getElementById('dpadRing');
              const sub = document.getElementById('okSubLabel');
              btn.classList.toggle('active', gyroEnabled);
              ring.classList.toggle('gyro-on', gyroEnabled);
              txt.textContent = gyroEnabled
                ? 'Sihirli İmleç: Açık (Hareket Ettirin)'
                : 'Sihirli İmleç (Jiroskop): Kapalı';
              sub.textContent = gyroEnabled ? 'SOL TIK' : '';
            }

            function cycleSensitivity() {
              sensIndex = (sensIndex + 1) % sensLevels.length;
              const item = sensLevels[sensIndex];
              vibrate(15);
              document.getElementById('sensBtn').textContent = 'Hız: ' + item.label;
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroSensitivity(item.val);
              }
            }

            function tapKey(code) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendKey(code);
            }

            function tapConsumer(usage) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendConsumer(usage);
            }

            function clickMouse(btn) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.clickMouse(btn);
            }

            function startVoice() {
              vibrate(25);
              if (window.AndroidBridge) window.AndroidBridge.startVoice();
            }

            function reconnectOrScan() {
              vibrate();
              if (!isConnected && window.AndroidBridge) {
                window.AndroidBridge.reconnectLast();
              } else {
                openScanner();
              }
            }

            function sendManualText() {
              const input = document.getElementById('manualText');
              const val = input.value;
              if (!val) {
                tapKey(40);
                return;
              }
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendText(val);
              input.value = '';
            }

            function openAdjustModal() {
              vibrate();
              document.getElementById('adjustModal').classList.add('open');
            }

            function closeAdjustModal() {
              document.getElementById('adjustModal').classList.remove('open');
            }

            function applyFilters() {
              const b = document.getElementById('brightRange').value;
              const c = document.getElementById('contrastRange').value;
              document.getElementById('brightVal').textContent = b + '%';
              document.getElementById('contrastVal').textContent = c + '%';
              document.body.style.filter = `brightness(${b}%) contrast(${c}%)`;
            }

            function resetFilters() {
              vibrate(20);
              document.getElementById('brightRange').value = 100;
              document.getElementById('contrastRange').value = 100;
              applyFilters();
            }

            function bindButtonPress(btn, onDown, onUp) {
              let active = false;
              const handleStart = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (active) return;
                active = true;
                btn.classList.add('pressed');
                onDown();
              };
              const handleEnd = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                if (!active) return;
                active = false;
                btn.classList.remove('pressed');
                if (onUp) onUp();
              };
              btn.addEventListener('touchstart', handleStart, { passive: false });
              btn.addEventListener('touchend', handleEnd, { passive: false });
              btn.addEventListener('touchcancel', handleEnd, { passive: false });
              btn.addEventListener('mousedown', handleStart);
              btn.addEventListener('mouseup', handleEnd);
              btn.addEventListener('mouseleave', handleEnd);
            }

            (function initHoldButtons() {
              document.querySelectorAll('[data-hold-key]').forEach((btn) => {
                const keyCode = parseInt(btn.getAttribute('data-hold-key'), 10);
                bindButtonPress(btn, () => {
                  vibrate(14);
                  if (gyroEnabled) {
                    gyroEnabled = false;
                    updateGyroUi();
                    if (window.AndroidBridge) window.AndroidBridge.setGyroEnabled(false);
                  }
                  if (window.AndroidBridge) window.AndroidBridge.keyDown(keyCode);
                }, () => {
                  if (window.AndroidBridge) window.AndroidBridge.keyUp(keyCode);
                });
              });

              const okBtn = document.getElementById('okButton');
              bindButtonPress(okBtn, () => {
                vibrate(16);
                if (gyroEnabled) {
                  clickMouse(1);
                } else if (window.AndroidBridge) {
                  window.AndroidBridge.keyDown(40);
                }
              }, () => {
                if (!gyroEnabled && window.AndroidBridge) {
                  window.AndroidBridge.keyUp(40);
                }
              });

              document.querySelectorAll('[data-hold-consumer]').forEach((btn) => {
                const usage = parseInt(btn.getAttribute('data-hold-consumer'), 10);
                let repeatTimer = null;
                bindButtonPress(btn, () => {
                  vibrate(14);
                  tapConsumer(usage);
                  clearInterval(repeatTimer);
                  repeatTimer = setInterval(() => tapConsumer(usage), 140);
                }, () => {
                  clearInterval(repeatTimer);
                  repeatTimer = null;
                });
              });
            })();

            /* TOUCHPAD: Serbest Dokunmatik & Çift Parmak */
            (function initTouchpad() {
              const surface = document.getElementById('touchSurface');
              const strip = document.getElementById('scrollStrip');
              let lastX = 0, lastY = 0, startX = 0, startY = 0, startTime = 0;
              let accX = 0, accY = 0, moveTimer = null;
              let isTwoFinger = false;
              let lastTwoX = 0, lastTwoY = 0;

              surface.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                  isTwoFinger = false;
                  const t = e.touches[0];
                  lastX = startX = t.clientX;
                  lastY = startY = t.clientY;
                  startTime = Date.now();
                } else if (e.touches.length === 2) {
                  isTwoFinger = true;
                  lastTwoX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                  lastTwoY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
              }, { passive: false });

              surface.addEventListener('touchmove', (e) => {
                e.preventDefault();

                // Çift parmakla manuel kaydırma
                if (e.touches.length === 2) {
                  const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                  const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                  const dX = midX - lastTwoX;
                  const dY = midY - lastTwoY;
                  lastTwoX = midX;
                  lastTwoY = midY;

                  let wheelV = 0, wheelH = 0;
                  if (Math.abs(dY) > 2) wheelV = dY > 0 ? 1 : -1;
                  if (Math.abs(dX) > 2) wheelH = dX > 0 ? 1 : -1;

                  if ((wheelV !== 0 || wheelH !== 0) && window.AndroidBridge) {
                    window.AndroidBridge.scrollMouse(wheelV, wheelH);
                  }
                  return;
                }

                // Tek parmak: İmleç serbest hareketi (Kenar kontrolünü Kotlin Sanal Ekranı yapar)
                if (e.touches.length === 1) {
                  const t = e.touches[0];
                  accX += (t.clientX - lastX) * 1.8;
                  accY += (t.clientY - lastY) * 1.8;
                  lastX = t.clientX;
                  lastY = t.clientY;

                  if (!moveTimer) {
                    moveTimer = setTimeout(() => {
                      const dx = Math.round(accX);
                      const dy = Math.round(accY);
                      accX = 0; accY = 0; moveTimer = null;
                      if ((dx !== 0 || dy !== 0) && window.AndroidBridge) {
                        window.AndroidBridge.moveMouse(dx, dy, 0);
                      }
                    }, 14);
                  }
                }
              }, { passive: false });

              surface.addEventListener('touchend', (e) => {
                if (!isTwoFinger && e.touches.length === 0) {
                  const dist = Math.hypot(lastX - startX, lastY - startY);
                  if (Date.now() - startTime < 220 && dist < 12) {
                    clickMouse(1);
                  }
                }
                if (e.touches.length === 0) isTwoFinger = false;
              });

              surface.addEventListener('touchcancel', () => {
                isTwoFinger = false;
              });

              // Yan Şerit Scroll
              let lastScrollY = 0;
              strip.addEventListener('touchstart', (e) => {
                lastScrollY = e.touches[0].clientY;
              }, { passive: true });

              strip.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const y = e.touches[0].clientY;
                const diff = lastScrollY - y;
                if (Math.abs(diff) > 10) {
                  const wheel = diff > 0 ? 1 : -1;
                  lastScrollY = y;
                  if (window.AndroidBridge) window.AndroidBridge.scrollMouse(wheel, 0);
                }
              }, { passive: false });
            })();

            // LG Sanal Ekran Kenarına Vurulduğunda Haptik ve Görsel Geri Bildirim
            window.onEdgeScrollActive = function(dir) {
              vibrate(10);
              const badge = document.getElementById('edgeIndicator');
              if (badge) {
                const labels = {
                  down: '▼ Aşağı Kaydırılıyor',
                  up: '▲ Yukarı Kaydırılıyor',
                  left: '◀ Sola Kaydırılıyor',
                  right: '▶ Sağa Kaydırılıyor'
                };
                badge.textContent = labels[dir] || 'Kenar Kaydırma';
                badge.classList.add('active');
                clearTimeout(badgeTimer);
                badgeTimer = setTimeout(() => {
                  badge.classList.remove('active');
                  badge.textContent = 'LG Kenar Kaydırma Aktif';
                }, 450);
              }
            };

            function openScanner() {
              vibrate(20);
              const modal = document.getElementById('scanModal');
              if (modal) modal.classList.add('open');
              rescan();
            }

            function closeScanner() {
              const modal = document.getElementById('scanModal');
              if (modal) modal.classList.remove('open');
              isConnectingFromModal = false;
              if (window.AndroidBridge) window.AndroidBridge.stopScan();
            }

            document.getElementById('scanModal').addEventListener('click', (e) => {
              if (e.target.id === 'scanModal') closeScanner();
            });
            document.getElementById('adjustModal').addEventListener('click', (e) => {
              if (e.target.id === 'adjustModal') closeAdjustModal();
            });

            function rescan() {
              for (const k in foundDevices) delete foundDevices[k];
              renderDeviceList();
              document.getElementById('scanStatus').textContent = 'Eşleşmiş ve çevredeki açık cihazlar aranıyor...';
              if (window.AndroidBridge) window.AndroidBridge.startScan();
            }

            function renderDeviceList() {
              const container = document.getElementById('deviceList');
              const keys = Object.keys(foundDevices);
              if (keys.length === 0) {
                container.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:34px;">Cihazlar taranıyor veya eşleşmiş cihaz aranıyor...</div>';
                return;
              }
              container.innerHTML = '';
              keys.forEach((addr) => {
                const d = foundDevices[addr];
                const item = document.createElement('div');
                item.className = 'dev-card';
                item.onclick = () => {
                  vibrate(25);
                  isConnectingFromModal = true;
                  document.getElementById('scanStatus').textContent = d.name + ' bağlanıyor...';
                  if (window.AndroidBridge) window.AndroidBridge.connectDevice(d.address);
                };
                item.innerHTML = `
                  <div>
                    <div class="dev-title">${d.name}</div>
                    <div class="dev-mac">${d.address}</div>
                  </div>
                  <div class="dev-tag">${d.isPaired ? 'Kayıtlı' : 'Yeni'}</div>
                `;
                container.appendChild(item);
              });
            }

            window.onDeviceFound = function(address, name, rssi, isPaired) {
              foundDevices[address] = { address, name, rssi, isPaired };
              renderDeviceList();
            };

            window.onScanFinished = function() {
              const count = Object.keys(foundDevices).length;
              document.getElementById('scanStatus').textContent = count > 0
                ? `${count} cihaz listelendi. Bağlanmak için dokunun.`
                : 'Cihaz bulunamadı. Yeniden tarayabilirsiniz.';
            };

            window.onBluetoothStateChanged = function(state, name) {
              const dot = document.getElementById('statusDot');
              const txt = document.getElementById('statusText');
              dot.classList.remove('connected', 'connecting');
              if (state === 'CONNECTED') {
                isConnected = true;
                dot.classList.add('connected');
                txt.textContent = name;
                if (isConnectingFromModal) {
                  closeScanner();
                }
              } else if (state === 'CONNECTING') {
                isConnected = false;
                dot.classList.add('connecting');
                txt.textContent = 'Bağlanıyor: ' + name;
              } else {
                isConnected = false;
                txt.textContent = name ? (name + ' (Dokun)') : 'Bağlı Değil';
              }
            };

            window.onNativeSpeechResult = function(text) {
              document.getElementById('manualText').value = text;
            };
          </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/java/com/kumandarus/app/MainActivity.kt
          package com.kumandarus.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.*
          import android.content.*
