name: Kumandarus APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Kumandarus Projesini Olustur
        run: |
          rm -rf app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kumandarus/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kumandarus"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kumandarus.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kumandarus.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 21
                  versionName "21.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090D16" android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round"
                  android:pathData="M38,20 C48,11 60,11 70,20" />
              <path
                  android:fillColor="#1E293B"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.8"
                  android:pathData="M40,28 L68,28 A8,8 0 0,1 76,36 L76,80 A8,8 0 0,1 68,88 L40,88 A8,8 0 0,1 32,80 L32,36 A8,8 0 0,1 40,28 Z" />
              <path
                  android:fillColor="#0284C7"
                  android:pathData="M54,42 A10,10 0 1,1 53.9,42 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,42 A4,4 0 1,1 53.9,42 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.TRANSMIT_IR" />

              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.consumerir" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Kumandarus"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/kumandarus.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Kumandarus</title>
              <style>
                  :root {
                      --bg: #07090e;
                      --card-bg: rgba(18, 24, 38, 0.7);
                      --border: rgba(56, 189, 248, 0.2);
                      --accent: #38bdf8;
                      --accent-glow: rgba(56, 189, 248, 0.45);
                      --red: #ef4444;
                      --green: #22c55e;
                      --text: #f8fafc;
                      --text-muted: #94a3b8;
                  }

                  * {
                      box-sizing: border-box;
                      margin: 0;
                      padding: 0;
                      user-select: none;
                      -webkit-user-select: none;
                      -webkit-tap-highlight-color: transparent;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                  }

                  body {
                      background: radial-gradient(circle at 50% 20%, #111827 0%, #05070a 100%);
                      color: var(--text);
                      min-height: 100vh;
                      display: flex;
                      flex-direction: column;
                      justify-content: space-between;
                      overflow: hidden;
                      padding: 14px 16px env(safe-area-inset-bottom, 16px);
                  }

                  /* EN ÜST ALAN: SADECE LOGO & İSİM - SIFIR BUTON */
                  .brand-zone {
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      padding: 22px 0 8px;
                      pointer-events: none;
                  }

                  .brand-logo-text {
                      font-size: 26px;
                      font-weight: 900;
                      letter-spacing: 5px;
                      background: linear-gradient(135deg, #e0f2fe 0%, #38bdf8 50%, #818cf8 100%);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                      text-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
                  }

                  .brand-tagline {
                      font-size: 11px;
                      font-weight: 500;
                      letter-spacing: 2px;
                      color: var(--text-muted);
                      text-transform: uppercase;
                      margin-top: 4px;
                      opacity: 0.8;
                  }

                  /* ANA İÇERİK */
                  .view-container {
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      justify-content: center;
                      gap: 12px;
                      max-width: 420px;
                      width: 100%;
                      margin: 0 auto;
                  }

                  .panel {
                      display: none;
                      width: 100%;
                      flex-direction: column;
                      align-items: center;
                      gap: 12px;
                  }

                  .panel.active {
                      display: flex;
                  }

                  /* D-PAD ÜSTÜ KONTROL KÜMESİ */
                  .control-cluster {
                      width: 100%;
                      display: flex;
                      flex-direction: column;
                      gap: 10px;
                      background: var(--card-bg);
                      border: 1px solid var(--border);
                      backdrop-filter: blur(12px);
                      padding: 10px 12px;
                      border-radius: 20px;
                      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
                  }

                  .cluster-row {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      gap: 10px;
                      width: 100%;
                  }

                  .btn-pill {
                      flex: 1;
                      height: 44px;
                      background: rgba(30, 41, 59, 0.8);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      color: var(--text);
                      border-radius: 12px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      font-size: 13px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.15s ease;
                  }

                  .btn-pill:active {
                      transform: scale(0.96);
                  }

                  .btn-power {
                      flex: 1.2;
                      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.4));
                      border-color: rgba(239, 68, 68, 0.4);
                      color: #fca5a5;
                  }

                  .btn-power:active {
                      background: rgba(239, 68, 68, 0.5);
                  }

                  .btn-status {
                      flex: 1.5;
                      font-size: 12px;
                      background: rgba(15, 23, 42, 0.75);
                      border-color: rgba(255, 255, 255, 0.05);
                  }

                  .status-dot {
                      width: 8px;
                      height: 8px;
                      border-radius: 50%;
                      background: #eab308;
                      box-shadow: 0 0 8px #eab308;
                  }

                  .status-dot.connected {
                      background: var(--green);
                      box-shadow: 0 0 10px var(--green);
                  }

                  .btn-bt {
                      flex: 0.8;
                  }

                  /* GYRO ÇUBUĞU */
                  .gyro-bar {
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      width: 100%;
                  }

                  .gyro-toggle {
                      flex: 3;
                      height: 40px;
                      background: rgba(30, 41, 59, 0.6);
                      border: 1px solid rgba(56, 189, 248, 0.25);
                      border-radius: 12px;
                      color: var(--text);
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 8px;
                      font-size: 13px;
                      font-weight: 600;
                      cursor: pointer;
                  }

                  .gyro-toggle.active {
                      background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(14, 165, 233, 0.45));
                      border-color: var(--accent);
                      box-shadow: 0 0 16px var(--accent-glow);
                      color: #e0f2fe;
                  }

                  .speed-btn {
                      flex: 1;
                      height: 40px;
                      background: rgba(30, 41, 59, 0.8);
                      border: 1px solid rgba(255, 255, 255, 0.1);
                      border-radius: 12px;
                      color: var(--text-muted);
                      font-size: 12px;
                      font-weight: 700;
                      cursor: pointer;
                  }

                  /* D-PAD ÇEMBERİ */
                  .dpad-container {
                      position: relative;
                      width: 230px;
                      height: 230px;
                      border-radius: 50%;
                      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
                      border: 2px solid rgba(56, 189, 248, 0.25);
                      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.05);
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      margin: 6px 0;
                  }

                  .dpad-btn {
                      position: absolute;
                      background: transparent;
                      border: none;
                      color: #cbd5e1;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-size: 18px;
                      transition: all 0.1s;
                  }

                  .dpad-btn:active {
                      color: var(--accent);
                      transform: scale(0.92);
                  }

                  .dpad-up { top: 12px; left: 50%; transform: translateX(-50%); width: 75px; height: 55px; }
                  .dpad-down { bottom: 12px; left: 50%; transform: translateX(-50%); width: 75px; height: 55px; }
                  .dpad-left { left: 12px; top: 50%; transform: translateY(-50%); width: 55px; height: 75px; }
                  .dpad-right { right: 12px; top: 50%; transform: translateY(-50%); width: 55px; height: 75px; }

                  .dpad-ok {
                      width: 82px;
                      height: 82px;
                      border-radius: 50%;
                      background: linear-gradient(135deg, #1e293b, #0f172a);
                      border: 2px solid rgba(56, 189, 248, 0.35);
                      color: #f8fafc;
                      font-weight: 800;
                      font-size: 17px;
                      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
                      cursor: pointer;
                      z-index: 2;
                  }

                  .dpad-ok:active {
                      background: var(--accent);
                      color: #040810;
                      box-shadow: 0 0 18px var(--accent-glow);
                      transform: scale(0.94);
                  }

                  /* ALT TUŞ SATIRLARI */
                  .nav-grid {
                      display: grid;
                      grid-template-columns: repeat(3, 1fr);
                      gap: 10px;
                      width: 100%;
                  }

                  .nav-btn {
                      height: 48px;
                      background: rgba(30, 41, 59, 0.6);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      border-radius: 14px;
                      color: var(--text);
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      gap: 3px;
                      font-size: 11px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.12s;
                  }

                  .nav-btn:active {
                      background: rgba(56, 189, 248, 0.2);
                      border-color: var(--accent);
                      transform: scale(0.95);
                  }

                  /* TOUCHPAD ALANI */
                  .touchpad-box {
                      width: 100%;
                      height: 380px;
                      background: rgba(18, 24, 38, 0.6);
                      border: 1px dashed rgba(56, 189, 248, 0.3);
                      border-radius: 20px;
                      position: relative;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      touch-action: none;
                  }

                  .touchpad-label {
                      font-size: 13px;
                      color: var(--text-muted);
                      letter-spacing: 1px;
                      pointer-events: none;
                      text-align: center;
                  }

                  .touchpad-actions {
                      display: grid;
                      grid-template-columns: 1fr 1fr;
                      gap: 10px;
                      width: 100%;
                  }

                  /* ALT MOD SEÇİCİ */
                  .tab-bar {
                      display: flex;
                      background: rgba(15, 23, 42, 0.85);
                      border: 1px solid rgba(255, 255, 255, 0.08);
                      border-radius: 18px;
                      padding: 4px;
                      max-width: 420px;
                      width: 100%;
                      margin: 0 auto;
                  }

                  .tab-btn {
                      flex: 1;
                      padding: 10px;
                      border: none;
                      background: transparent;
                      color: var(--text-muted);
                      font-weight: 700;
                      font-size: 13px;
                      border-radius: 14px;
                      cursor: pointer;
                      transition: all 0.2s;
                  }

                  .tab-btn.active {
                      background: var(--accent);
                      color: #040810;
                      box-shadow: 0 0 14px var(--accent-glow);
                  }

                  /* BLUETOOTH MODAL */
                  .modal-overlay {
                      display: none;
                      position: fixed;
                      top: 0; left: 0; right: 0; bottom: 0;
                      background: rgba(0, 0, 0, 0.75);
                      backdrop-filter: blur(6px);
                      z-index: 100;
                      align-items: center;
                      justify-content: center;
                      padding: 20px;
                  }

                  .modal-overlay.active {
                      display: flex;
                  }

                  .modal-card {
                      background: #0f172a;
                      border: 1px solid var(--border);
                      border-radius: 20px;
                      padding: 20px;
                      width: 100%;
                      max-width: 380px;
                      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
                  }

                  .modal-title {
                      font-size: 16px;
                      font-weight: 700;
                      margin-bottom: 14px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }

                  .device-list {
                      max-height: 220px;
                      overflow-y: auto;
                      display: flex;
                      flex-direction: column;
                      gap: 8px;
                      margin-bottom: 14px;
                  }

                  .device-item {
                      background: rgba(30, 41, 59, 0.6);
                      padding: 10px 12px;
                      border-radius: 10px;
                      font-size: 13px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      border: 1px solid rgba(255, 255, 255, 0.05);
                      cursor: pointer;
                  }

                  .device-item:active {
                      background: rgba(56, 189, 248, 0.2);
                  }

                  .modal-close-btn {
                      width: 100%;
                      padding: 10px;
                      background: #1e293b;
                      border: none;
                      border-radius: 10px;
                      color: #fff;
                      font-weight: 600;
                      cursor: pointer;
                  }

                  svg {
                      width: 18px;
                      height: 18px;
                      fill: currentColor;
                  }
              </style>
          </head>
          <body>

              <!-- EN ÜST: SADECE BAŞLIK (BUTON YOK) -->
              <div class="brand-zone">
                  <div class="brand-logo-text">KUMANDARUS</div>
                  <div class="brand-tagline">Akıllı Projeksiyon & TV</div>
              </div>

              <div class="view-container">

                  <!-- KUMANDA PANELİ -->
                  <div class="panel active" id="remotePanel">

                      <!-- YÖN TUŞLARININ HEMEN ÜSTÜNDEKİ KONTROL KÜMESİ -->
                      <div class="control-cluster">
                          <div class="cluster-row">
                              <button class="btn-pill btn-power" onclick="powerClick()" title="Açma/Kapatma (IR)">
                                  <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.47 1.13-4.68 2.91-6.15L5.49 4.43A9.95 9.95 0 0 0 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-2.88-1.22-5.48-3.17-7.83z"/></svg>
                                  <span>Güç</span>
                              </button>

                              <button class="btn-pill btn-status" onclick="fastConnect()" title="Hızlı Yeniden Bağlan">
                                  <span class="status-dot" id="statusDot"></span>
                                  <span id="statusTxt">Bağlan</span>
                              </button>

                              <button class="btn-pill btn-bt" onclick="openBtModal()" title="Cihaz Seç">
                                  <svg viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
                              </button>
                          </div>

                          <!-- Sihirli İmleç Satırı -->
                          <div class="gyro-bar">
                              <button class="gyro-toggle" id="gyroToggle" onclick="toggleGyro()">
                                  <span>✨</span>
                                  <span id="gyroTxt">Sihirli İmleç: Kapalı</span>
                              </button>
                              <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()">Hız: 1x</button>
                          </div>
                      </div>

                      <!-- D-PAD YÖN TUŞLARI (OK tuşu tek atımlıktır, oto-odaklama başlatmaz) -->
                      <div class="dpad-container">
                          <button class="dpad-btn dpad-up" onpointerdown="navDown(82)" onpointerup="navUp()">▲</button>
                          <button class="dpad-btn dpad-left" onpointerdown="navDown(80)" onpointerup="navUp()">◀</button>
                          <button class="dpad-ok" onclick="tapOk(event)">OK</button>
                          <button class="dpad-btn dpad-right" onpointerdown="navDown(79)" onpointerup="navUp()">▶</button>
                          <button class="dpad-btn dpad-down" onpointerdown="navDown(81)" onpointerup="navUp()">▼</button>
                      </div>

                      <!-- ALT GEZİNME VE SES SATIRLARI -->
                      <div class="nav-grid">
                          <button class="nav-btn" onclick="sendCons(0x0224)">
                              <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                              <span>Geri</span>
                          </button>
                          <button class="nav-btn" onclick="sendCons(0x0223)">
                              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                              <span>Ana Sayfa</span>
                          </button>
                          <button class="nav-btn" onclick="sendKey(0, 101)">
                              <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                              <span>Menü</span>
                          </button>
                      </div>

                      <div class="nav-grid">
                          <button class="nav-btn" onclick="sendCons(0x00EA)">
                              <svg viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
                              <span>Ses -</span>
                          </button>
                          <button class="nav-btn" onclick="sendCons(0x00E2)">
                              <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                              <span>Sessiz</span>
                          </button>
                          <button class="nav-btn" onclick="sendCons(0x00E9)">
                              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                              <span>Ses +</span>
                          </button>
                      </div>

                  </div>

                  <!-- TOUCHPAD PANELİ -->
                  <div class="panel" id="touchPanel">
                      <div class="touchpad-box" id="touchpad">
                          <div class="touchpad-label">
                              <span>İmleç Dokunmatik Alanı</span><br>
                              <small style="opacity: 0.6;">Kenarlara sürükleyerek LG Magic gibi kademeli kaydırın</small>
                          </div>
                      </div>
                      <div class="touchpad-actions">
                          <button class="nav-btn" onclick="sendMouseClick(1)">Sol Tık</button>
                          <button class="nav-btn" onclick="sendMouseClick(2)">Sağ Tık</button>
                      </div>
                  </div>

              </div>

              <!-- MOD SEÇİCİ ALT TAB -->
              <div class="tab-bar">
                  <button class="tab-btn active" id="tabRemote" onclick="switchTab('remote')">Kumanda</button>
                  <button class="tab-btn" id="tabTouch" onclick="switchTab('touch')">Touchpad</button>
              </div>

              <!-- BLUETOOTH CİHAZ LİSTESİ MODAL -->
              <div class="modal-overlay" id="btModal">
                  <div class="modal-card">
                      <div class="modal-title">
                          <span>Eşleşmiş Cihazlar</span>
                          <span style="cursor:pointer;" onclick="closeBtModal()">✕</span>
                      </div>
                      <div class="device-list" id="deviceList">
                          <div style="font-size:12px; color:var(--text-muted); text-align:center; padding:10px;">Cihazlar yükleniyor...</div>
                      </div>
                      <button class="modal-close-btn" onclick="closeBtModal()">Kapat</button>
                  </div>
              </div>

              <script>
                  let gyroActive = false;
                  let currentSpeed = 1.0;
                  const speeds = [1.0, 1.5, 2.0];
                  let speedIndex = 0;

                  function vib(ms = 12) {
                      if (window.AndroidBridge && AndroidBridge.vibrate) {
                          AndroidBridge.vibrate(ms);
                      }
                  }

                  function switchTab(type) {
                      vib(10);
                      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

                      if (type === 'remote') {
                          document.getElementById('remotePanel').classList.add('active');
                          document.getElementById('tabRemote').classList.add('active');
                      } else {
                          document.getElementById('touchPanel').classList.add('active');
                          document.getElementById('tabTouch').classList.add('active');
                      }
                  }

                  // GÜÇ TUŞU: SADECE BURADA IR ÇALIŞIR
                  function powerClick() {
                      vib(25);
                      if (window.AndroidBridge) {
                          AndroidBridge.triggerHybridPower();
                      }
                  }

                  // OK TUŞU: TEK SEFERLİK DİSKRET SİNYAL (OTOMATİK ODAKLAMA BAŞLATMAZ)
                  function tapOk(e) {
                      if (e) e.preventDefault();
                      vib(18);
                      if (window.AndroidBridge) {
                          AndroidBridge.tapOkKey();
                      }
                  }

                  function navDown(code) {
                      vib(10);
                      if (window.AndroidBridge) {
                          AndroidBridge.sendKeyboardKey(0, code);
                      }
                  }
                  function navUp() {}

                  function sendCons(code) {
                      vib(12);
                      if (window.AndroidBridge) {
                          AndroidBridge.sendConsumerKey(code);
                      }
                  }

                  function sendKey(mod, code) {
                      vib(12);
                      if (window.AndroidBridge) {
                          AndroidBridge.sendKeyboardKey(mod, code);
                      }
                  }

                  function toggleGyro() {
                      vib(15);
                      gyroActive = !gyroActive;
                      const btn = document.getElementById('gyroToggle');
                      const txt = document.getElementById('gyroTxt');
                      if (gyroActive) {
                          btn.classList.add('active');
                          txt.innerText = 'Sihirli İmleç: Açık';
                      } else {
                          btn.classList.remove('active');
                          txt.innerText = 'Sihirli İmleç: Kapalı';
                      }
                      if (window.AndroidBridge) {
                          AndroidBridge.setGyroActive(gyroActive);
                      }
                  }

                  function cycleSpeed() {
                      vib(10);
                      speedIndex = (speedIndex + 1) % speeds.length;
                      currentSpeed = speeds[speedIndex];
                      document.getElementById('speedBtn').innerText = 'Hız: ' + currentSpeed + 'x';
                      if (window.AndroidBridge) {
                          AndroidBridge.setSpeedMultiplier(currentSpeed);
                      }
                  }

                  function fastConnect() {
                      vib(15);
                      if (window.AndroidBridge) {
                          AndroidBridge.fastReconnect();
                      }
                  }

                  window.updateBtStatus = function(connected, name) {
                      const dot = document.getElementById('statusDot');
                      const txt = document.getElementById('statusTxt');
                      if (connected) {
                          dot.classList.add('connected');
                          txt.innerText = name ? (name.length > 9 ? name.substring(0,9) : name) : 'Bağlı';
                      } else {
                          dot.classList.remove('connected');
                          txt.innerText = 'Bağlan';
                      }
                  };

                  function openBtModal() {
                      vib(10);
                      document.getElementById('btModal').classList.add('active');
                      if (window.AndroidBridge) {
                          AndroidBridge.requestBondedDevices();
                      }
                  }

                  function closeBtModal() {
                      document.getElementById('btModal').classList.remove('active');
                  }

                  window.renderDeviceList = function(devices) {
                      const list = document.getElementById('deviceList');
                      list.innerHTML = '';
                      if (!devices || devices.length === 0) {
                          list.innerHTML = '<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">Eşleşmiş cihaz bulunamadı.</div>';
                          return;
                      }
                      devices.forEach(d => {
                          const item = document.createElement('div');
                          item.className = 'device-item';
                          item.innerHTML = `<span><b>${d.name}</b><br><small style="opacity:0.6">${d.address}</small></span><span>Bağlan</span>`;
                          item.onclick = function() {
                              vib(15);
                              if (window.AndroidBridge) {
                                  AndroidBridge.connectToAddress(d.address);
                              }
                              closeBtModal();
                          };
                          list.appendChild(item);
                      });
                  };

                  // TOUCHPAD - KENARA ÇARPINCA KADEMELİ KAYDIRMA
                  const tp = document.getElementById('touchpad');
                  let lastX = 0, lastY = 0;
                  let tracking = false;
                  let edgeScrollTimer = null;

                  tp.addEventListener('pointerdown', (e) => {
                      tp.setPointerCapture(e.pointerId);
                      tracking = true;
                      lastX = e.clientX;
                      lastY = e.clientY;
                  });

                  tp.addEventListener('pointermove', (e) => {
                      if (!tracking) return;
                      const dx = (e.clientX - lastX) * currentSpeed;
                      const dy = (e.clientY - lastY) * currentSpeed;
                      lastX = e.clientX;
                      lastY = e.clientY;

                      if (window.AndroidBridge) {
                          AndroidBridge.sendMouseMove(Math.round(dx), Math.round(dy));
                      }

                      const rect = tp.getBoundingClientRect();
                      const relX = e.clientX - rect.left;
                      const relY = e.clientY - rect.top;
                      const threshold = 28;

                      let scrollY = 0;
                      let scrollX = 0;

                      if (relY < threshold) scrollY = 1;
                      else if (relY > rect.height - threshold) scrollY = -1;

                      if (relX < threshold) scrollX = 1;
                      else if (relX > rect.width - threshold) scrollX = -1;

                      if ((scrollY !== 0 || scrollX !== 0) && !edgeScrollTimer) {
                          edgeScrollTimer = setInterval(() => {
                              if (window.AndroidBridge) {
                                  if (scrollY !== 0) AndroidBridge.sendMouseScroll(scrollY);
                              }
                          }, 160);
                      } else if (scrollY === 0 && scrollX === 0 && edgeScrollTimer) {
                          clearInterval(edgeScrollTimer);
                          edgeScrollTimer = null;
                      }
                  });

                  function stopTouch(e) {
                      tracking = false;
                      if (edgeScrollTimer) {
                          clearInterval(edgeScrollTimer);
                          edgeScrollTimer = null;
                      }
                  }

                  tp.addEventListener('pointerup', stopTouch);
                  tp.addEventListener('pointercancel', stopTouch);

                  function sendMouseClick(btn) {
                      vib(12);
                      if (window.AndroidBridge) {
                          AndroidBridge.sendMouseClick(btn);
                      }
                  }
              </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/java/com/kumandarus/app/MainActivity.kt
          package com.kumandarus.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.*
          import android.content.Context
          import android.content.SharedPreferences
          import android.hardware.ConsumerIrManager
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.*
          import android.util.Log
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class MainActivity : Activity(), SensorEventListener {

              private lateinit var webView: WebView
              private lateinit var prefs: SharedPreferences
              private var btAdapter: BluetoothAdapter? = null
              private var hidDevice: BluetoothHidDevice? = null
              private var currentDevice: BluetoothDevice? = null
              private var irManager: ConsumerIrManager? = null
              private var vibrator: Vibrator? = null

              private lateinit var sensorManager: SensorManager
              private var gyroSensor: Sensor? = null

              private val executor = Executors.newSingleThreadExecutor()
              private val mainHandler = Handler(Looper.getMainLooper())

              private var gyroActive = false
              private var speedMultiplier = 1.0f

              companion object {
                  private const val PREF_LAST_DEVICE = "last_addr"

                  // Standart USB HID Rapor Tanımlayıcısı
                  private val HID_DESCRIPTOR = intArrayOf(
                      0x05, 0x01, 0x09, 0x06, 0xA1, 0x01, 0x85, 0x01, // Klavye (Rapor ID 1)
                      0x05, 0x07, 0x19, 0xE0, 0x29, 0xE7, 0x15, 0x00,
                      0x25, 0x01, 0x75, 0x01, 0x95, 0x08, 0x81, 0x02,
                      0x95, 0x01, 0x75, 0x08, 0x81, 0x01, 0x95, 0x06,
                      0x75, 0x08, 0x15, 0x00, 0x25, 0x65, 0x05, 0x07,
                      0x19, 0x00, 0x29, 0x65, 0x81, 0x00, 0xC0,
                      0x05, 0x0C, 0x09, 0x01, 0xA1, 0x01, 0x85, 0x02, // Tüketici Denetimleri (Rapor ID 2)
                      0x19, 0x00, 0x2A, 0x9C, 0x02, 0x15, 0x00, 0x26,
                      0x9C, 0x02, 0x95, 0x01, 0x75, 0x10, 0x81, 0x00,
                      0xC0,
                      0x05, 0x01, 0x09, 0x02, 0xA1, 0x01, 0x85, 0x03, // Fare (Rapor ID 3)
                      0x09, 0x01, 0xA1, 0x00, 0x05, 0x09, 0x19, 0x01,
                      0x29, 0x03, 0x15, 0x00, 0x25, 0x01, 0x95, 0x03,
                      0x75, 0x01, 0x81, 0x02, 0x95, 0x01, 0x75, 0x05,
                      0x81, 0x01, 0x05, 0x01, 0x09, 0x30, 0x09, 0x31,
                      0x09, 0x38, 0x15, 0x81, 0x25, 0x7F, 0x75, 0x08,
                      0x95, 0x03, 0x81, 0x06, 0xC0, 0xC0
                  ).map { it.toByte() }.toByteArray()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("kumandarus_prefs", Context.MODE_PRIVATE)

                  val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  btAdapter = btManager?.adapter
                  irManager = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  gyroSensor = sensorManager.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                  initBluetoothHid()

                  webView = WebView(this)
                  setContentView(webView)

                  with(webView.settings) {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_NO_CACHE
                  }

                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  webView.loadUrl("file:///android_asset/kumandarus.html")
              }

              override fun onResume() {
                  super.onResume()
                  gyroSensor?.let {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
                  fastReconnectDevice()
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      hidDevice?.let { btAdapter?.closeProfileProxy(BluetoothProfile.HID_DEVICE, it) }
                  } catch (_: Exception) {}
              }

              private fun initBluetoothHid() {
                  btAdapter?.getProfileProxy(this, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hidDevice = proxy as BluetoothHidDevice

                              val sdp = BluetoothHidDeviceAppSdpSettings(
                                  "Kumandarus", "Kumandarus Projector Remote", "Google",
                                  BluetoothHidDevice.SUBCLASS1_COMBO, HID_DESCRIPTOR
                              )

                              hidDevice?.registerApp(sdp, null, null, executor, object : BluetoothHidDevice.Callback() {
                                  override fun onAppStatusChanged(pluggedDevice: BluetoothDevice?, registered: Boolean) {
                                      if (registered) {
                                          fastReconnectDevice()
                                      }
                                  }

                                  override fun onConnectionStateChanged(device: BluetoothDevice?, state: Int) {
                                      val isConn = (state == BluetoothProfile.STATE_CONNECTED)
                                      currentDevice = if (isConn) device else null

                                      if (isConn && device != null) {
                                          prefs.edit().putString(PREF_LAST_DEVICE, device.address).apply()
                                      }

                                      mainHandler.post {
                                          val name = device?.name ?: "Projeksiyon"
                                          webView.evaluateJavascript("window.updateBtStatus($isConn, '$name')", null)
                                      }
                                  }
                              })
                          }
                      }

                      override fun onServiceDisconnected(profile: Int) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hidDevice = null
                          }
                      }
                  }, BluetoothProfile.HID_DEVICE)
              }

              private fun fastReconnectDevice() {
                  executor.execute {
                      val adapter = btAdapter ?: return@execute
                      if (!adapter.isEnabled) return@execute
                      val hid = hidDevice ?: return@execute

                      if (adapter.isDiscovering) {
                          try { adapter.cancelDiscovery() } catch (_: Exception) {}
                      }

                      val connected = try { hid.connectedDevices } catch (_: Exception) { emptyList() }
                      if (connected.isNotEmpty()) {
                          val dev = connected[0]
                          currentDevice = dev
                          mainHandler.post {
                              webView.evaluateJavascript("window.updateBtStatus(true, '${dev.name ?: "Bağlı"}')", null)
                          }
                          return@execute
                      }

                      val lastAddr = prefs.getString(PREF_LAST_DEVICE, null)
                      val bonded = adapter.bondedDevices ?: emptySet()
                      val target = if (!lastAddr.isNullOrBlank()) {
                          bonded.firstOrNull { it.address.equals(lastAddr, ignoreCase = true) }
                              ?: try { adapter.getRemoteDevice(lastAddr) } catch (_: Exception) { null }
                      } else {
                          bonded.firstOrNull()
                      }

                      target?.let {
                          try {
                              hid.connect(it)
                          } catch (e: Exception) {
                              Log.e("Kumandarus", "Fast connect error: ${e.message}")
                          }
                      }
                  }
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (!gyroActive || currentDevice == null || event.sensor.type != Sensor.TYPE_GYROSCOPE) return

                  val rotX = event.values[0]
                  val rotZ = event.values[2]

                  val deadzone = 0.035f
                  val cleanZ = if (abs(rotZ) < deadzone) 0f else rotZ
                  val cleanX = if (abs(rotX) < deadzone) 0f else rotX
                  if (cleanZ == 0f && cleanX == 0f) return

                  val dx = (-cleanZ * 24f * speedMultiplier).toInt().coerceIn(-127, 127)
                  val dy = (-cleanX * 24f * speedMultiplier).toInt().coerceIn(-127, 127)

                  if (dx != 0 || dy != 0) {
                      sendMouseReport(0, dx.toByte(), dy.toByte(), 0)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun sendMouseReport(buttons: Byte, dx: Byte, dy: Byte, wheel: Byte) {
                  val dev = currentDevice ?: return
                  val report = byteArrayOf(buttons, dx, dy, wheel)
                  hidDevice?.sendReport(dev, 3, report)
              }

              private fun sendKeyboardReport(modifier: Byte, keyCode: Byte) {
                  val dev = currentDevice ?: return
                  val report = byteArrayOf(modifier, 0, keyCode, 0, 0, 0, 0, 0)
                  hidDevice?.sendReport(dev, 1, report)
              }

              private fun sendConsumerReport(code: Int) {
                  val dev = currentDevice ?: return
                  val report = byteArrayOf((code and 0xFF).toByte(), ((code shr 8) and 0xFF).toByte())
                  hidDevice?.sendReport(dev, 2, report)
                  mainHandler.postDelayed({
                      hidDevice?.sendReport(dev, 2, byteArrayOf(0, 0))
                  }, 40)
              }

              // KIZILÖTESİ (IR) SİNYALİ - SADECE GÜÇ TUŞUNDA TETİKLENİR
              private fun transmitNec(b0: Int, b1: Int, cmd: Int) {
                  val ir = irManager ?: return
                  if (!ir.hasIrEmitter()) return

                  val invCmd = (cmd.inv()) and 0xFF
                  val pattern = IntArray(68)
                  pattern[0] = 9000
                  pattern[1] = 4500
                  var idx = 2
                  val bytes = intArrayOf(b0 and 0xFF, b1 and 0xFF, cmd and 0xFF, invCmd)
                  for (b in bytes) {
                      for (bit in 0 until 8) {
                          pattern[idx++] = 560
                          pattern[idx++] = if (((b shr bit) and 1) == 1) 1690 else 560
                      }
                  }
                  pattern[66] = 560
                  pattern[67] = 20000

                  try {
                      ir.transmit(38000, pattern)
                  } catch (e: Exception) {
                      Log.e("Kumandarus", "IR transmit failed: ${e.message}")
                  }
              }

              inner class AndroidBridge {

                  @JavascriptInterface
                  fun vibrate(ms: Long) {
                      vibrator?.let {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              it.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              it.vibrate(ms)
                          }
                      }
                  }

                  // 1. KESİNLİKLE SADECE BURADA IR ÇALIŞIR
                  @JavascriptInterface
                  fun triggerHybridPower() {
                      // Projeksiyon IR Güç Kodu: 0x80, 0x7F, 0x12
                      transmitNec(0x80, 0x7F, 0x12)
                      // Yedek olarak Bluetooth Güç Sinyali
                      sendConsumerReport(0x0030)
                  }

                  // 2. OK TUŞU: TEK SEFERLİK DİSKRET SİNYAL (OTOMATİK ODAKLAMA BAŞLATMAZ)
                  @JavascriptInterface
                  fun tapOkKey() {
                      // 40 = Return (Enter). Anlık 30ms sinyal gönderip bırakır.
                      mainHandler.post {
                          sendKeyboardReport(0, 40)
                          mainHandler.postDelayed({
                              sendKeyboardReport(0, 0)
                          }, 30)
                      }
                  }

                  @JavascriptInterface
                  fun sendKeyboardKey(mod: Int, code: Int) {
                      mainHandler.post {
                          sendKeyboardReport(mod.toByte(), code.toByte())
                          mainHandler.postDelayed({
                              sendKeyboardReport(0, 0)
                          }, 35)
                      }
                  }

                  @JavascriptInterface
                  fun sendConsumerKey(code: Int) {
                      sendConsumerReport(code)
                  }

                  @JavascriptInterface
                  fun sendMouseMove(dx: Int, dy: Int) {
                      sendMouseReport(0, dx.coerceIn(-127, 127).toByte(), dy.coerceIn(-127, 127).toByte(), 0)
                  }

                  @JavascriptInterface
                  fun sendMouseScroll(wheel: Int) {
                      sendMouseReport(0, 0, 0, wheel.coerceIn(-127, 127).toByte())
                  }

                  @JavascriptInterface
                  fun sendMouseClick(button: Int) {
                      val b = if (button == 1) 0x01.toByte() else 0x02.toByte()
                      sendMouseReport(b, 0, 0, 0)
                      mainHandler.postDelayed({
                          sendMouseReport(0, 0, 0, 0)
                      }, 40)
                  }

                  @JavascriptInterface
                  fun setGyroActive(active: Boolean) {
                      gyroActive = active
                  }

                  @JavascriptInterface
                  fun setSpeedMultiplier(speed: Float) {
                      speedMultiplier = speed
                  }

                  @JavascriptInterface
                  fun fastReconnect() {
                      fastReconnectDevice()
                  }

                  @JavascriptInterface
                  fun requestBondedDevices() {
                      executor.execute {
                          val bonded = btAdapter?.bondedDevices ?: emptySet()
                          val jsonArray = JSONArray()
                          for (d in bonded) {
                              val obj = JSONObject()
                              obj.put("name", d.name ?: "Bilinmeyen Cihaz")
                              obj.put("address", d.address)
                              jsonArray.put(obj)
                          }
                          mainHandler.post {
                              webView.evaluateJavascript("window.renderDeviceList($jsonArray)", null)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun connectToAddress(addr: String) {
                      executor.execute {
                          try {
                              val target = btAdapter?.getRemoteDevice(addr)
                              if (target != null) {
                                  hidDevice?.connect(target)
                              }
                          } catch (e: Exception) {
                              Log.e("Kumandarus", "Connect error: ${e.message}")
                          }
                      }
                  }
              }
          }
