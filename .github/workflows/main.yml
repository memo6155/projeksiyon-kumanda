            <!-- Alt Hızlı Klavye Çubuğu -->
            <div class="keyboard-bar">
              <input id="manualText" class="kb-input" type="text" placeholder="Metin yazın veya mikrofona dokunun..." />
              <button class="kb-btn" onclick="tapKey(42)" title="Sil">⌫</button>
              <button class="kb-btn send" onclick="sendManualText()">Gönder</button>
