                      <div id="airMouseText">Air Mouse (Gyro) Başlat</div>
                  </div>

                  <div class="btn-grid" style="grid-template-columns: 1fr;">
                      <button class="btn" style="background:#0284c7; border:none; padding:12px;" onclick="startVoiceInput()">🎤 Türkçe Sesle Yaz / Ara</button>
                  </div>
              </div>

              <div id="filterModal" class="modal">
                  <div class="modal-card">
                      <h3 style="color:#38bdf8; font-size:1.05rem;">Projeksiyon Canlı Filtre</h3>
                      <div class="slider-row">
                          <label><span>Parlaklık (Dimmer)</span><span id="bVal">100%</span></label>
                          <input type="range" id="bSlider" min="15" max="100" value="100" oninput="onFilterChange()">
                      </div>
                      <div class="slider-row">
                          <label><span>Renk Sıcaklığı (Gece Modu)</span><span id="wVal">0%</span></label>
                          <input type="range" id="wSlider" min="0" max="100" value="0" oninput="onFilterChange()">
                      </div>
                      <button class="btn" style="margin-top:8px;" onclick="closeFilterModal()">Kapat</button>
                  </div>
              </div>

              <script>
                  let airMouseActive = false;
                  function sendKey(code) { if (window.Android) window.Android.sendKey(code); }
                  function sendCmd(cmd) { if (window.Android) window.Android.sendCmd(cmd); }
                  function startVoiceInput() { if (window.Android) window.Android.startVoiceInput(); }

                  function toggleAirMouse() {
                      airMouseActive = !airMouseActive;
                      const area = document.getElementById('airMouseArea');
                      const txt = document.getElementById('airMouseText');
                      if (airMouseActive) {
                          area.classList.add('active');
                          txt.innerText = 'Air Mouse Aktif (Durdurmak için bas)';
                          if (window.Android) window.Android.setAirMouse(true);
                      } else {
                          area.classList.remove('active');
                          txt.innerText = 'Air Mouse (Gyro) Başlat';
                          if (window.Android) window.Android.setAirMouse(false);
                      }
                  }

                  function openFilterModal() { document.getElementById('filterModal').classList.add('active'); }
                  function closeFilterModal() { document.getElementById('filterModal').classList.remove('active'); }

                  function onFilterChange() {
                      const b = document.getElementById('bSlider').value;
                      const w = document.getElementById('wSlider').value;
                      document.getElementById('bVal').innerText = b + '%';
                      document.getElementById('wVal').innerText = w + '%';
                      if (window.Android) window.Android.setFilter(parseInt(b), parseInt(w));
                  }

                  function updateStatus(connected) {
                      const badge = document.getElementById('statusBadge');
                      if (connected) {
                          badge.innerText = 'BAGLANDI';
                          badge.classList.add('connected');
                      } else {
                          badge.innerText = 'BAGLANTI YOK';
                          badge.classList.remove('connected');
                      }
                  }
              </script>
          </body>
          </html>
          EOF

          cat << 'EOF' > app/src/main/java/com/kumandarus/app/MainActivity.kt
          package com.kumandarus.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.*
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.content.Context
          import android.content.Intent
          import android.hardware.ConsumerIrManager
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelUuid
          import android.speech.RecognizerIntent
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID
          import kotlin.concurrent.thread

          class MainActivity : Activity(), SensorEventListener {

              private lateinit var webView: WebView
              private var sensorManager: SensorManager? = null
              private var gyroSensor: Sensor? = null
              private var irManager: ConsumerIrManager? = null

              private var bluetoothManager: BluetoothManager? = null
              private var bluetoothAdapter: BluetoothAdapter? = null
              private var hidDevice: BluetoothHidDevice? = null
              private var connectedDevice: BluetoothDevice? = null

              private var isAirMouseEnabled = false
              private val handler = Handler(Looper.getMainLooper())
              private var projectorIp = "192.168.0.10"

              private val hidUuid = UUID.fromString("00001124-0000-1000-8000-00805f9b34fb")

              private val hidReportDescriptor = byteArrayOf(
                  0x05.toByte(), 0x01.toByte(), 0x09.toByte(), 0x02.toByte(),
                  0xA1.toByte(), 0x01.toByte(), 0x85.toByte(), 0x01.toByte(),
                  0x09.toByte(), 0x01.toByte(), 0xA1.toByte(), 0x00.toByte(),
                  0x05.toByte(), 0x09.toByte(), 0x19.toByte(), 0x01.toByte(),
                  0x29.toByte(), 0x03.toByte(), 0x15.toByte(), 0x00.toByte(),
                  0x25.toByte(), 0x01.toByte(), 0x95.toByte(), 0x03.toByte(),
                  0x75.toByte(), 0x01.toByte(), 0x81.toByte(), 0x02.toByte(),
                  0x95.toByte(), 0x01.toByte(), 0x75.toByte(), 0x05.toByte(),
                  0x81.toByte(), 0x01.toByte(), 0x05.toByte(), 0x01.toByte(),
                  0x09.toByte(), 0x30.toByte(), 0x09.toByte(), 0x31.toByte(),
                  0x15.toByte(), 0x81.toByte(), 0x25.toByte(), 0x7F.toByte(),
                  0x75.toByte(), 0x08.toByte(), 0x95.toByte(), 0x02.toByte(),
                  0x81.toByte(), 0x06.toByte(), 0xC0.toByte(), 0xC0.toByte(),
                  0x05.toByte(), 0x0C.toByte(), 0x09.toByte(), 0x01.toByte(),
                  0xA1.toByte(), 0x01.toByte(), 0x85.toByte(), 0x02.toByte(),
                  0x15.toByte(), 0x00.toByte(), 0x26.toByte(), 0x9C.toByte(),
                  0x02.toByte(), 0x19.toByte(), 0x00.toByte(), 0x2A.toByte(),
                  0x9C.toByte(), 0x02.toByte(), 0x95.toByte(), 0x01.toByte(),
                  0x75.toByte(), 0x10.toByte(), 0x81.toByte(), 0x00.toByte(),
                  0xC0.toByte()
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  initWebView()
                  initSensors()
                  initIr()
                  initBluetoothHid()
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun initWebView() {
                  webView = WebView(this)
                  setContentView(webView)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.addJavascriptInterface(WebAppInterface(), "Android")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun initSensors() {
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  gyroSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_GYROSCOPE)
              }

              private fun initIr() {
                  irManager = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager
              }

              private fun initBluetoothHid() {
                  bluetoothManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  bluetoothAdapter = bluetoothManager?.adapter

                  val sdp = BluetoothHidDeviceAppSdpSettings(
                      "Kumandarus", "Yaber K1 Kumandasi", "Google",
                      BluetoothHidDevice.SUBCLASS1_COMBO, hidReportDescriptor
                  )

                  bluetoothAdapter?.getProfileProxy(this, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hidDevice = proxy as BluetoothHidDevice
                              try {
                                  hidDevice?.registerApp(sdp, null, null, { it.run() }, hidCallback)
                              } catch (e: SecurityException) {
                                  e.printStackTrace()
                              }
                          }
                      }
                      override fun onServiceDisconnected(profile: Int) {
                          if (profile == BluetoothProfile.HID_DEVICE) hidDevice = null
                      }
                  }, BluetoothProfile.HID_DEVICE)
              }

              private val hidCallback = object : BluetoothHidDevice.Callback() {
                  override fun onConnectionStateChanged(device: BluetoothDevice, state: Int) {
                      super.onConnectionStateChanged(device, state)
                      if (state == BluetoothProfile.STATE_CONNECTED) {
                          connectedDevice = device
                          handler.post { webView.evaluateJavascript("updateStatus(true);", null) }
                      } else if (state == BluetoothProfile.STATE_DISCONNECTED) {
                          connectedDevice = null
                          handler.post { webView.evaluateJavascript("updateStatus(false);", null) }
                      }
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_GYROSCOPE && isAirMouseEnabled) {
                      val dx = (-event.values[2] * 20).toInt().coerceIn(-127, 127).toByte()
                      val dy = (-event.values[0] * 20).toInt().coerceIn(-127, 127).toByte()
                      sendMouseReport(0, dx, dy)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun sendMouseReport(buttons: Byte, dx: Byte, dy: Byte) {
                  val dev = connectedDevice ?: return
                  val report = byteArrayOf(buttons, dx, dy)
                  try {
                      hidDevice?.sendReport(dev, 1, report)
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                  }
              }

              private fun sendConsumerReport(usageCode: Int) {
                  val dev = connectedDevice ?: return
                  val b0 = (usageCode and 0xFF).toByte()
                  val b1 = ((usageCode shr 8) and 0xFF).toByte()
                  try {
                      hidDevice?.sendReport(dev, 2, byteArrayOf(b0, b1))
                      handler.postDelayed({
                          hidDevice?.sendReport(dev, 2, byteArrayOf(0, 0))
                      }, 50)
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                  }
              }

              inner class WebAppInterface {
                  @JavascriptInterface
                  fun sendKey(keyCode: Int) {
                      when (keyCode) {
                          19 -> sendConsumerReport(0x0042) // Up
                          20 -> sendConsumerReport(0x0043) // Down
                          21 -> sendConsumerReport(0x0044) // Left
                          22 -> sendConsumerReport(0x0045) // Right
                          66 -> sendConsumerReport(0x0041) // OK / Select
                          4  -> sendConsumerReport(0x0224) // Back
                          3  -> sendConsumerReport(0x0223) // Home
                          82 -> sendConsumerReport(0x0040) // Menu
                          24 -> sendConsumerReport(0x00E9) // Vol +
                          25 -> sendConsumerReport(0x00EA) // Vol -
                          164 -> sendConsumerReport(0x00E2) // Mute
                      }
                  }

                  @JavascriptInterface
                  fun sendCmd(cmd: String) {
                      if (cmd == "POWER") {
                          sendConsumerReport(0x0030)
                      }
                  }

                  @JavascriptInterface
                  fun setAirMouse(enabled: Boolean) {
                      isAirMouseEnabled = enabled
                      if (enabled) {
                          gyroSensor?.let {
                              sensorManager?.registerListener(this@MainActivity, it, SensorManager.SENSOR_DELAY_GAME)
                          }
                      } else {
                          sensorManager?.unregisterListener(this@MainActivity)
                      }
                  }

                  @JavascriptInterface
                  fun startVoiceInput() {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                          putExtra(RecognizerIntent.EXTRA_PROMPT, "Konuşun...")
                      }
                      try {
                          startActivityForResult(intent, 2001)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  @JavascriptInterface
                  fun setFilter(brightness: Int, warmth: Int) {
                      thread {
                          try {
                              val url = URL("http://$projectorIp:8088/filter?b=$brightness&w=$warmth")
                              val conn = url.openConnection() as HttpURLConnection
                              conn.connectTimeout = 1500
                              conn.readTimeout = 1500
                              conn.responseCode
                              conn.disconnect()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 2001 && resultCode == RESULT_OK) {
                      val results = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      val spokenText = results?.firstOrNull() ?: return
                      sendTextViaAdb(spokenText)
                  }
              }

              private fun sendTextViaAdb(text: String) {
                  thread {
                      try {
                          val url = URL("http://$projectorIp:8088/input?text=" + java.net.URLEncoder.encode(text, "UTF-8"))
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 1500
                          conn.responseCode
                          conn.disconnect()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  sensorManager?.unregisterListener(this)
              }
          }
