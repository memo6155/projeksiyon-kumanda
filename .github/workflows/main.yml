                </div>
                <div id="irList" class="dev-list"></div>
                <button class="soft-btn ir-test-btn" onclick="sweepAllIr()">⚡ Tüm Projeksiyon Kodlarını Sırayla Dene</button>
              </div>
            </div>

          <script>
            const foundDevices = {};
            let isConnected = false;
            let gyroEnabled = false;
            let selectedIrIndex = 0;

            const irProfiles = [
              { name: "Yaber Ace K1 / Yaber Pro (Profil 1)", desc: "NEC 0x00FF - Cmd 0x40 (Varsayılan)" },
              { name: "Yaber Ace K1 / Smart OS (Profil 2)", desc: "NEC 0x00FF - Cmd 0x10" },
              { name: "Yaber / Genel DLP Projeksiyon (Profil 3)", desc: "NEC 0x00FF - Cmd 0x45" },
              { name: "Yaber / LCD Projeksiyon (Profil 4)", desc: "NEC 0x00FF - Cmd 0x0A" },
              { name: "Android Smart Projeksiyon (Profil 5)", desc: "NEC 0x00FF - Cmd 0x1C" },
              { name: "Wanbo / Xiaomi Projeksiyon", desc: "NEC 0x40BF - Cmd 0x0B" },
              { name: "Magcubic / HY300 / Allwinner", desc: "NEC 0x807F - Cmd 0x12" },
              { name: "Anker Nebula / ViewSonic", desc: "NEC 0x20DF - Cmd 0x10" },
              { name: "BenQ Projeksiyon", desc: "NEC 0x0030 - Cmd 0x02" },
              { name: "Epson Projeksiyon", desc: "NEC 0x8355 - Cmd 0x90" },
              { name: "LG Smart TV / Projeksiyon", desc: "NEC 0x04FB - Cmd 0x08" },
              { name: "Samsung Smart TV / Projeksiyon", desc: "NEC 0x0707 - Cmd 0x02" }
            ];

            const sensLevels = [
              { label: 'Yavaş', val: 14 },
              { label: 'Orta', val: 22 },
              { label: 'Hızlı', val: 32 }
            ];
            let sensIndex = 1;

            function vibrate(ms = 14) {
              if (navigator.vibrate) navigator.vibrate(ms);
            }

            // Mod Değişimi: Touchpad'den Kumandaya dönerken Android TV Fare Kilidini (Touch Mode) Kaldırır
            function switchMode(mode) {
              vibrate(14);
              document.getElementById('tabRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('tabTouch').classList.toggle('active', mode === 'touch');
              document.getElementById('panelRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('panelTouch').classList.toggle('active', mode === 'touch');

              if (mode === 'remote') {
                if (gyroEnabled) {
                  gyroEnabled = false;
                  updateGyroUi();
                }
                if (window.AndroidBridge) {
                  window.AndroidBridge.recoverDpadFocus();
                }
              } else {
                if (window.AndroidBridge) {
                  window.AndroidBridge.releaseAllHid();
                }
              }
            }

            // Hibrit Güç Tuşu: Hem Kızılötesi (IR) hem Bluetooth Güç gönderir
            function triggerHybridPower() {
              vibrate(30);
              if (window.AndroidBridge) {
                window.AndroidBridge.triggerPowerHybrid();
              }
            }

            // Geri ve Menü tuşları hem Consumer hem Klavye yedekli çalışır (Touchpad sonrası kilitlenmeyi önler)
            function tapBack() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendBackKey();
            }

            function tapMenu() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendMenuKey();
            }

            function toggleGyroMouse() {
              gyroEnabled = !gyroEnabled;
              vibrate(22);
              updateGyroUi();
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroEnabled(gyroEnabled);
              }
            }

            function updateGyroUi() {
              const btn = document.getElementById('gyroBtn');
              const txt = document.getElementById('gyroText');
              const ring = document.getElementById('dpadRing');
              const sub = document.getElementById('okSubLabel');
              btn.classList.toggle('active', gyroEnabled);
              ring.classList.toggle('gyro-on', gyroEnabled);
              txt.textContent = gyroEnabled
                ? 'Sihirli İmleç: Açık (Hareket Ettirin)'
                : 'Sihirli İmleç (Jiroskop): Kapalı';
              sub.textContent = gyroEnabled ? 'SOL TIK' : '';
            }

            function cycleSensitivity() {
              sensIndex = (sensIndex + 1) % sensLevels.length;
              const item = sensLevels[sensIndex];
              vibrate(15);
              document.getElementById('sensBtn').textContent = 'Hız: ' + item.label;
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroSensitivity(item.val);
              }
            }

            function tapKey(code) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendKey(code);
            }

            function tapConsumer(usage) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendConsumer(usage);
            }

            function clickMouse(btn) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.clickMouse(btn);
            }

            function startVoice() {
              vibrate(25);
              if (window.AndroidBridge) window.AndroidBridge.startVoice();
            }

            function reconnectOrScan() {
              vibrate();
              if (!isConnected && window.AndroidBridge) {
                window.AndroidBridge.reconnectLast();
              } else {
                openScanner();
              }
            }

            function sendManualText() {
              const input = document.getElementById('manualText');
              const val = input.value;
              if (!val) {
                tapKey(40);
                return;
              }
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendText(val);
              input.value = '';
            }

            // Yön Tuşları: Basıldığında Jiroskop açıksa otomatik kapatır ve D-Pad odağını geri alır
            (function initHoldButtons() {
              document.querySelectorAll('[data-hold-key]').forEach((btn) => {
                const keyCode = parseInt(btn.getAttribute('data-hold-key'), 10);
                let active = false;

                const startHold = (e) => {
                  e.preventDefault();
                  if (active) return;
                  active = true;
                  btn.classList.add('pressed');
                  vibrate(14);
                  if (gyroEnabled) {
                    gyroEnabled = false;
                    updateGyroUi();
                    if (window.AndroidBridge) window.AndroidBridge.setGyroEnabled(false);
                  }
                  if (window.AndroidBridge) window.AndroidBridge.keyDown(keyCode);
                };

                const endHold = () => {
                  if (!active) return;
                  active = false;
                  btn.classList.remove('pressed');
                  if (window.AndroidBridge) window.AndroidBridge.keyUp(keyCode);
                };

                btn.addEventListener('touchstart', startHold, { passive: false });
                btn.addEventListener('touchend', endHold);
                btn.addEventListener('touchcancel', endHold);
                btn.addEventListener('mousedown', startHold);
                btn.addEventListener('mouseup', endHold);
                btn.addEventListener('mouseleave', endHold);
              });

              const okBtn = document.getElementById('okButton');
              let okActive = false;
              const startOk = (e) => {
                e.preventDefault();
                if (okActive) return;
                okActive = true;
                okBtn.classList.add('pressed');
                vibrate(16);
                if (gyroEnabled) {
                  clickMouse(1);
                } else if (window.AndroidBridge) {
                  window.AndroidBridge.keyDown(40);
                }
              };
              const endOk = () => {
                if (!okActive) return;
                okActive = false;
                okBtn.classList.remove('pressed');
                if (!gyroEnabled && window.AndroidBridge) {
                  window.AndroidBridge.keyUp(40);
                }
              };
              okBtn.addEventListener('touchstart', startOk, { passive: false });
              okBtn.addEventListener('touchend', endOk);
              okBtn.addEventListener('touchcancel', endOk);
              okBtn.addEventListener('mousedown', startOk);
              okBtn.addEventListener('mouseup', endOk);

              document.querySelectorAll('[data-hold-consumer]').forEach((btn) => {
                const usage = parseInt(btn.getAttribute('data-hold-consumer'), 10);
                let timer = null;

                const startRepeat = (e) => {
                  e.preventDefault();
                  btn.classList.add('pressed');
                  tapConsumer(usage);
                  clearInterval(timer);
                  timer = setInterval(() => tapConsumer(usage), 140);
                };

                const stopRepeat = () => {
                  btn.classList.remove('pressed');
                  clearInterval(timer);
                  timer = null;
                };

                btn.addEventListener('touchstart', startRepeat, { passive: false });
                btn.addEventListener('touchend', stopRepeat);
                btn.addEventListener('touchcancel', stopRepeat);
              });
            })();

            // Touchpad (Fare) Kontrolleri
            (function initTouchpad() {
              const surface = document.getElementById('touchSurface');
              const strip = document.getElementById('scrollStrip');
              let lastX = 0, lastY = 0, startX = 0, startY = 0, startTime = 0;
              let accX = 0, accY = 0, timer = null;

              surface.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                lastX = startX = t.clientX;
                lastY = startY = t.clientY;
                startTime = Date.now();
              }, { passive: true });

              surface.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                accX += (t.clientX - lastX) * 1.75;
                accY += (t.clientY - lastY) * 1.75;
                lastX = t.clientX;
                lastY = t.clientY;

                if (!timer) {
                  timer = setTimeout(() => {
                    const dx = Math.round(accX);
                    const dy = Math.round(accY);
                    accX = 0; accY = 0; timer = null;
                    if ((dx !== 0 || dy !== 0) && window.AndroidBridge) {
                      window.AndroidBridge.moveMouse(dx, dy, 0);
                    }
                  }, 14);
                }
              }, { passive: false });

              surface.addEventListener('touchend', () => {
                const dist = Math.hypot(lastX - startX, lastY - startY);
                if (Date.now() - startTime < 220 && dist < 10) {
                  clickMouse(1);
                }
              });

              let lastScrollY = 0;
              strip.addEventListener('touchstart', (e) => {
                lastScrollY = e.touches[0].clientY;
              }, { passive: true });

              strip.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const y = e.touches[0].clientY;
                const diff = lastScrollY - y;
                if (Math.abs(diff) > 14) {
                  const wheel = diff > 0 ? -1 : 1;
                  lastScrollY = y;
                  if (window.AndroidBridge) window.AndroidBridge.moveMouse(0, 0, wheel);
                }
              }, { passive: false });
            })();

            // Kızılötesi (IR) Paketi Penceresi
            function openIrModal() {
              vibrate();
              if (window.AndroidBridge) {
                selectedIrIndex = window.AndroidBridge.getSavedIrIndex();
              }
              renderIrList();
              document.getElementById('irModal').classList.add('open');
            }

            function closeIrModal() {
              document.getElementById('irModal').classList.remove('open');
            }

            function renderIrList() {
              const container = document.getElementById('irList');
              container.innerHTML = '';
              irProfiles.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'dev-card' + (idx === selectedIrIndex ? ' selected' : '');
                card.onclick = () => {
                  vibrate(25);
                  selectedIrIndex = idx;
                  renderIrList();
                  document.getElementById('irStatus').textContent = p.name + ' sinyali gönderildi ve Güç tuşuna kaydedildi.';
                  if (window.AndroidBridge) {
                    window.AndroidBridge.selectAndTestIr(idx);
                  }
                };
                card.innerHTML = `
                  <div>
                    <div class="dev-title">${p.name}</div>
                    <div class="dev-mac">${p.desc}</div>
                  </div>
                  <div class="dev-tag">${idx === selectedIrIndex ? 'Seçili • Test' : 'Dene'}</div>
                `;
                container.appendChild(card);
              });
            }

            function sweepAllIr() {
              vibrate(30);
              document.getElementById('irStatus').textContent = 'Tüm projeksiyon IR kodları sırayla gönderiliyor, telefonu Yaber Ace K1\'e tutun...';
              if (window.AndroidBridge) {
                window.AndroidBridge.sweepIrCodes();
              }
            }

            // Bluetooth Tarama Penceresi
            function openScanner() {
              vibrate();
              document.getElementById('scanModal').classList.add('open');
              rescan();
            }

            function closeScanner() {
              document.getElementById('scanModal').classList.remove('open');
              if (window.AndroidBridge) window.AndroidBridge.stopScan();
            }

            function rescan() {
              for (const k in foundDevices) delete foundDevices[k];
              renderDeviceList();
              document.getElementById('scanStatus').textContent = 'Eşleşmiş ve çevredeki açık cihazlar aranıyor...';
              if (window.AndroidBridge) window.AndroidBridge.startScan();
            }

            function renderDeviceList() {
              const container = document.getElementById('deviceList');
              const keys = Object.keys(foundDevices);
              if (keys.length === 0) {
                container.innerHTML = '<div style="color:#64748b;font-size:12px;text-align:center;margin-top:34px;">Çevredeki açık Bluetooth cihazlar aranıyor...</div>';
                return;
              }
              container.innerHTML = '';
              keys.forEach((addr) => {
                const d = foundDevices[addr];
                const item = document.createElement('div');
                item.className = 'dev-card';
                item.onclick = () => {
                  vibrate(20);
                  document.getElementById('scanStatus').textContent = d.name + ' bağlanıyor...';
                  if (window.AndroidBridge) window.AndroidBridge.connectDevice(d.address);
                };
                item.innerHTML = `
                  <div>
                    <div class="dev-title">${d.name}</div>
                    <div class="dev-mac">${d.address}</div>
                  </div>
                  <div class="dev-tag">${d.isPaired ? 'Kayıtlı' : 'Yeni'}</div>
                `;
                container.appendChild(item);
              });
            }

            window.onDeviceFound = function(address, name, rssi, isPaired) {
              foundDevices[address] = { address, name, rssi, isPaired };
              renderDeviceList();
            };

            window.onScanFinished = function() {
              const count = Object.keys(foundDevices).length;
              document.getElementById('scanStatus').textContent = count > 0
                ? `${count} cihaz listelendi. Bağlanmak için dokunun.`
                : 'Cihaz bulunamadı. Tekrar tarayabilirsiniz.';
            };

            window.onBluetoothStateChanged = function(state, name) {
              const dot = document.getElementById('statusDot');
              const txt = document.getElementById('statusText');
              dot.classList.remove('connected', 'connecting');
              if (state === 'CONNECTED') {
                isConnected = true;
                dot.classList.add('connected');
                txt.textContent = name;
                closeScanner();
              } else if (state === 'CONNECTING') {
                isConnected = false;
                dot.classList.add('connecting');
                txt.textContent = 'Bağlanıyor: ' + name;
              } else {
                isConnected = false;
                txt.textContent = name ? (name + ' (Dokun)') : 'Bağlı Değil';
              }
            };

            window.onNativeSpeechResult = function(text) {
              document.getElementById('manualText').value = text;
            };
          </script>
          </body>
          </html>
