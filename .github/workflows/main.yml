              <button id="tabTouch" class="dock-tab" onclick="switchMode('touch')">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="15" x2="12" y2="20"/></svg>
                Touchpad
