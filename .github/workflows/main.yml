              private fun buildRedmiSafeNecPattern(b0: Int, b1: Int, cmd: Int): IntArray {
                  val invCmd = (cmd.inv()) and 0xFF
                  val pattern = IntArray(68)
                  pattern[0] = 9000; pattern[1] = 4500
                  var idx = 2
                  val bytes = intArrayOf(b0 and 0xFF, b1 and 0xFF, cmd and 0xFF, invCmd)
                  for (b in bytes) {
                      for (bit in 0 until 8) {
                          pattern[idx++] = 560
                          pattern[idx++] = if (((b shr bit) and 1) == 1) 1690 else 560
                      }
                  }
                  pattern[66] = 560; pattern[67] = 20000
                  return pattern
              }

              private fun transmitNec(b0: Int, b1: Int, cmd: Int) {
                  val ir = irManager ?: return
                  if (!ir.hasIrEmitter()) return
                  executor.execute {
                      try {
                          val pattern = buildRedmiSafeNecPattern(b0, b1, cmd)
                          ir.transmit(38000, pattern)
                          Thread.sleep(95)
                          ir.transmit(38000, pattern)
                      } catch (_: Exception) {}
                  }
              }

              private fun registerGyroscope(enable: Boolean) {
                  val sm = sensorManager ?: return
                  val sensor = gyroSensor ?: return
                  if (enable) {
                      remX = 0f; remY = 0f
                      sm.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  } else {
                      sm.unregisterListener(this)
                      releaseAllHidChannels()
                  }
