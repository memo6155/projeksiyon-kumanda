                  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
                  .btn { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px 6px; color: #f8fafc; font-size: 0.85rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.1s; }
                  .btn:active { background: #38bdf8; color: #0f172a; transform: scale(0.96); }
                  .btn.power { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #ef4444; }
                  .btn.power:active { background: #ef4444; color: #fff; }
                  .btn.filter { background: rgba(56, 189, 248, 0.15); border-color: #38bdf8; color: #38bdf8; }
