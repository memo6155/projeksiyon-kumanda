                  intArrayOf(0x00, 0xFF, 0x10, 0xEF), // 1: Yaber Ace K1 Smart OS (Profil 2)
                  intArrayOf(0x00, 0xFF, 0x45, 0xBA), // 2: Yaber / DLP Projeksiyon (Profil 3)
                  intArrayOf(0x00, 0xFF, 0x0A, 0xF5), // 3: Yaber / LCD Projeksiyon (Profil 4)
                  intArrayOf(0x00, 0xFF, 0x1C, 0xE3), // 4: Genel Android Projeksiyon (Profil 5)
                  intArrayOf(0x40, 0xBF, 0x0B, 0xF4), // 5: Wanbo / Xiaomi
                  intArrayOf(0x80, 0x7F, 0x12, 0xED), // 6: Magcubic / HY300
                  intArrayOf(0x20, 0xDF, 0x10, 0xEF), // 7: Anker Nebula / ViewSonic
                  intArrayOf(0x00, 0x30, 0x02, 0xFD), // 8: BenQ Projeksiyon
                  intArrayOf(0x83, 0x55, 0x90, 0x6F), // 9: Epson Projeksiyon
                  intArrayOf(0x04, 0xFB, 0x08, 0xF7), // 10: LG Smart TV / Projeksiyon
                  intArrayOf(0x07, 0x07, 0x02, 0xFD)  // 11: Samsung Smart TV
              )

              private val HID_DESCRIPTOR = intArrayOf(
                  // Report ID 1: Keyboard
                  0x05, 0x01, 0x09, 0x06, 0xA1, 0x01, 0x85, 0x01,
                  0x05, 0x07, 0x19, 0xE0, 0x29, 0xE7, 0x15, 0x00,
                  0x25, 0x01, 0x75, 0x01, 0x95, 0x08, 0x81, 0x02,
                  0x95, 0x01, 0x75, 0x08, 0x81, 0x01, 0x95, 0x06,
                  0x75, 0x08, 0x15, 0x00, 0x25, 0x65, 0x05, 0x07,
                  0x19, 0x00, 0x29, 0x65, 0x81, 0x00, 0xC0,
                  // Report ID 2: Consumer Control
                  0x05, 0x0C, 0x09, 0x01, 0xA1, 0x01, 0x85, 0x02,
                  0x19, 0x00, 0x2A, 0x9C, 0x02, 0x15, 0x00, 0x26,
                  0x9C, 0x02, 0x95, 0x01, 0x75, 0x10, 0x81, 0x00,
                  0xC0,
                  // Report ID 3: Mouse (Touchpad & Gyro)
                  0x05, 0x01, 0x09, 0x02, 0xA1, 0x01, 0x85, 0x03,
                  0x09, 0x01, 0xA1, 0x00, 0x05, 0x09, 0x19, 0x01,
                  0x29, 0x03, 0x15, 0x00, 0x25, 0x01, 0x95, 0x03,
                  0x75, 0x01, 0x81, 0x02, 0x95, 0x01, 0x75, 0x05,
                  0x81, 0x01, 0x05, 0x01, 0x09, 0x30, 0x09, 0x31,
                  0x09, 0x38, 0x15, 0x81, 0x25, 0x7F, 0x75, 0x08,
                  0x95, 0x03, 0x81, 0x06, 0xC0, 0xC0
              ).map { it.toByte() }.toByteArray()

              private val btReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              val rssi = intent.getShortExtra(BluetoothDevice.EXTRA_RSSI, Short.MIN_VALUE).toInt()
                              val name = device?.name ?: intent.getStringExtra(BluetoothDevice.EXTRA_NAME)
                              if (device != null && !name.isNullOrBlank()) {
                                  sendDeviceToWeb(device.address, name, rssi, device.bondState == BluetoothDevice.BOND_BONDED)
                              }
                          }
                          BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                              runOnUiThread {
                                  webView.evaluateJavascript("if(window.onScanFinished) window.onScanFinished();", null)
                              }
                          }
                          BluetoothDevice.ACTION_BOND_STATE_CHANGED -> {
                              val device: BluetoothDevice? = intent.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)
                              val state = intent.getIntExtra(BluetoothDevice.EXTRA_BOND_STATE, BluetoothDevice.ERROR)
                              if (device != null && device.address == pendingDevice?.address && state == BluetoothDevice.BOND_BONDED) {
                                  pendingDevice = null
                                  saveLastDevice(device)
                                  hidDevice?.connect(device)
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("kumandarus_prefs", Context.MODE_PRIVATE)
                  webView = WebView(this)
                  setContentView(webView)

                  val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as? BluetoothManager
                  btAdapter = btManager?.adapter
                  irManager = getSystemService(Context.CONSUMER_IR_SERVICE) as? ConsumerIrManager

                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as? SensorManager
                  gyroSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_GYROSCOPE)

                  val filter = IntentFilter().apply {
                      addAction(BluetoothDevice.ACTION_FOUND)
                      addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                      addAction(BluetoothDevice.ACTION_BOND_STATE_CHANGED)
                  }
                  registerReceiver(btReceiver, filter)

                  webView.clearCache(true)
                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      cacheMode = WebSettings.LOAD_NO_CACHE
                  }
                  webView.addJavascriptInterface(AndroidBridge(), "AndroidBridge")
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          syncUiConnectionState()
                      }
                  }
                  webView.loadUrl("file:///android_asset/kumandarus.html")

                  requestNeededPermissions()
              }

              override fun onResume() {
                  super.onResume()
                  isAppInForeground = true
                  if (isGyroActive) registerGyroscope(true)
                  if (hasRequiredPermissions()) ensureHidAndAutoConnect()
              }

              override fun onPause() {
                  super.onPause()
                  isAppInForeground = false
                  releaseAllHidChannels()
                  registerGyroscope(false)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  releaseAllHidChannels()
                  registerGyroscope(false)
                  try { unregisterReceiver(btReceiver) } catch (_: Exception) {}
                  btAdapter?.cancelDiscovery()
              }

              // NEC 38kHz Kızılötesi Sinyal Üretici (Mikrosaniye darbe dizisi)
              private fun buildNecPattern(b0: Int, b1: Int, b2: Int, b3: Int): IntArray {
                  val list = ArrayList<Int>(68)
                  list.add(9000)
                  list.add(4500)
                  val bytes = intArrayOf(b0, b1, b2, b3)
                  for (b in bytes) {
                      for (bit in 0 until 8) {
                          list.add(560)
                          if (((b shr bit) and 1) == 1) {
                              list.add(1690)
                          } else {
                              list.add(560)
                          }
                      }
                  }
                  list.add(560)
                  list.add(40000)
                  return list.toIntArray()
              }

              private fun transmitIrProfile(index: Int, showToast: Boolean = false) {
                  val ir = irManager
                  if (ir == null || !ir.hasIrEmitter()) {
                      if (showToast) {
                          runOnUiThread {
                              Toast.makeText(this, "Bu telefonda Kizilotesi (IR) sensoru bulunamadi", Toast.LENGTH_SHORT).show()
                          }
                      }
                      return
                  }
                  val safeIdx = index.coerceIn(0, IR_PROFILES.size - 1)
                  val code = IR_PROFILES[safeIdx]
                  executor.execute {
                      try {
                          val pattern = buildNecPattern(code[0], code[1], code[2], code[3])
                          ir.transmit(38000, pattern)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun registerGyroscope(enable: Boolean) {
                  val sm = sensorManager ?: return
                  val sensor = gyroSensor ?: return
                  if (enable) {
                      remX = 0f
                      remY = 0f
                      sm.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  } else {
                      sm.unregisterListener(this)
                      releaseAllHidChannels()
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (!isGyroActive || event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                  if (connectedDevice == null) return

                  val rotX = event.values[0]
                  val rotZ = event.values[2]

                  val deadzone = 0.035f
                  val cleanZ = if (abs(rotZ) < deadzone) 0f else rotZ
                  val cleanX = if (abs(rotX) < deadzone) 0f else rotX
                  if (cleanZ == 0f && cleanX == 0f) return

                  val rawDx = (-cleanZ * gyroSensitivity) + remX
                  val rawDy = (-cleanX * gyroSensitivity) + remY

                  val dx = rawDx.roundToInt()
                  val dy = rawDy.roundToInt()

                  remX = rawDx - dx
                  remY = rawDy - dy

                  if (dx != 0 || dy != 0) {
                      sendMouseReport(0, dx, dy, 0)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun getRequiredPermissions(): List<String> {
                  val list = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.RECORD_AUDIO
                  )
                  if (Build.VERSION.SDK_INT >= 31) {
                      list.add(Manifest.permission.BLUETOOTH_SCAN)
                      list.add(Manifest.permission.BLUETOOTH_CONNECT)
                      list.add(Manifest.permission.BLUETOOTH_ADVERTISE)
                  }
                  return list
              }

              private fun hasRequiredPermissions(): Boolean {
                  return getRequiredPermissions().all {
                      checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED
                  }
              }

              private fun requestNeededPermissions(): Boolean {
                  val missing = getRequiredPermissions().filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  return if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), REQ_PERMS)
                      false
                  } else {
                      ensureHidAndAutoConnect()
                      true
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  ensureHidAndAutoConnect()
              }

              private fun saveLastDevice(device: BluetoothDevice) {
                  prefs.edit()
                      .putString("last_addr", device.address)
                      .putString("last_name", device.name ?: "Cihaz")
                      .apply()
              }

              private fun ensureHidAndAutoConnect() {
                  val adapter = btAdapter ?: return
                  if (!adapter.isEnabled) return

                  val proxy = hidDevice
                  if (proxy != null) {
                      val alreadyConnected = try { proxy.connectedDevices.firstOrNull() } catch (_: Exception) { null }
                      if (alreadyConnected != null) {
                          connectedDevice = alreadyConnected
                          notifyWebStatus("CONNECTED", alreadyConnected.name ?: "Cihaz")
                          return
                      }
                      autoReconnectToSaved()
                      return
                  }

                  adapter.getProfileProxy(this, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxyObj: BluetoothProfile?) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hidDevice = proxyObj as BluetoothHidDevice
                              registerHidApp()
                          }
                      }
                      override fun onServiceDisconnected(profile: Int) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              hidDevice = null
                              connectedDevice = null
                              if (isAppInForeground) {
                                  mainHandler.postDelayed({ ensureHidAndAutoConnect() }, 600)
                              }
                          }
                      }
                  }, BluetoothProfile.HID_DEVICE)
              }

              private fun registerHidApp() {
                  val sdp = BluetoothHidDeviceAppSdpSettings(
                      "kumandarus",
                      "Smart TV ve Projeksiyon Kumandasi",
                      "Android",
                      BluetoothHidDevice.SUBCLASS1_COMBO,
                      HID_DESCRIPTOR
                  )
                  hidDevice?.registerApp(sdp, null, null, executor, object : BluetoothHidDevice.Callback() {
                      override fun onAppStatusChanged(pluggedDevice: BluetoothDevice?, registered: Boolean) {
                          if (registered) {
                              autoReconnectToSaved(pluggedDevice)
                          } else {
                              hidDevice = null
                              if (isAppInForeground) {
                                  mainHandler.postDelayed({ ensureHidAndAutoConnect() }, 800)
                              }
                          }
                      }

                      override fun onConnectionStateChanged(device: BluetoothDevice?, state: Int) {
                          when (state) {
                              BluetoothProfile.STATE_CONNECTED -> {
                                  connectedDevice = device
                                  if (device != null) saveLastDevice(device)
                                  notifyWebStatus("CONNECTED", device?.name ?: "Cihaz")
                              }
                              BluetoothProfile.STATE_CONNECTING -> {
                                  notifyWebStatus("CONNECTING", device?.name ?: "Cihaz")
                              }
                              BluetoothProfile.STATE_DISCONNECTED -> {
                                  if (connectedDevice?.address == device?.address) {
                                      connectedDevice = null
                                  }
                                  val lastName = prefs.getString("last_name", "") ?: ""
                                  notifyWebStatus("DISCONNECTED", lastName)
                              }
                          }
                      }
                  })
              }

              private fun autoReconnectToSaved(pluggedDevice: BluetoothDevice? = null) {
                  val adapter = btAdapter ?: return
                  val proxy = hidDevice ?: return

                  val current = try { proxy.connectedDevices.firstOrNull() } catch (_: Exception) { null }
                  if (current != null) {
                      connectedDevice = current
                      notifyWebStatus("CONNECTED", current.name ?: "Cihaz")
                      return
                  }

                  val savedAddr = prefs.getString("last_addr", null)
                  val target: BluetoothDevice? = when {
                      !savedAddr.isNullOrBlank() -> adapter.bondedDevices?.firstOrNull { it.address == savedAddr }
                      pluggedDevice != null && pluggedDevice.bondState == BluetoothDevice.BOND_BONDED -> pluggedDevice
                      else -> null
                  }

                  if (target != null) {
                      notifyWebStatus("CONNECTING", target.name ?: "Cihaz")
                      proxy.connect(target)
                  } else {
                      syncUiConnectionState()
                  }
              }

              private fun syncUiConnectionState() {
                  val dev = connectedDevice
                  if (dev != null) {
                      notifyWebStatus("CONNECTED", dev.name ?: "Cihaz")
                  } else {
                      val lastName = prefs.getString("last_name", "") ?: ""
                      notifyWebStatus("DISCONNECTED", lastName)
                  }
              }

              private fun notifyWebStatus(state: String, name: String) {
                  val safeName = name.replace("'", "\\'")
                  runOnUiThread {
                      webView.evaluateJavascript(
                          "if(window.onBluetoothStateChanged) window.onBluetoothStateChanged('$state', '$safeName');",
                          null
                      )
                  }
              }

              private fun sendDeviceToWeb(address: String, name: String, rssi: Int, isPaired: Boolean) {
                  val safeName = name.replace("'", "\\'")
                  runOnUiThread {
                      webView.evaluateJavascript(
                          "if(window.onDeviceFound) window.onDeviceFound('$address', '$safeName', $rssi, $isPaired);",
                          null
                      )
                  }
              }

              private fun startLiveDiscovery() {
                  runOnUiThread {
                      if (!requestNeededPermissions()) return@runOnUiThread
                      val adapter = btAdapter ?: return@runOnUiThread
                      if (!adapter.isEnabled) {
                          startActivityForResult(Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE), REQ_ENABLE_BT)
                          return@runOnUiThread
                      }

                      adapter.bondedDevices?.forEach { d ->
                          val n = d.name
                          if (!n.isNullOrBlank()) {
                              sendDeviceToWeb(d.address, n, -50, true)
                          }
                      }

                      if (Build.VERSION.SDK_INT < 31) {
                          val lm = getSystemService(Context.LOCATION_SERVICE) as? LocationManager
                          val gpsOn = lm?.isProviderEnabled(LocationManager.GPS_PROVIDER) == true ||
                                      lm?.isProviderEnabled(LocationManager.NETWORK_PROVIDER) == true
                          if (!gpsOn) {
                              Toast.makeText(this, "Yeni cihaz taramasi icin Konum (GPS) acik olmalidir", Toast.LENGTH_LONG).show()
                          }
                      }

                      if (adapter.isDiscovering) adapter.cancelDiscovery()
                      adapter.startDiscovery()
                  }
              }

              private fun connectToAddress(address: String) {
                  runOnUiThread {
                      val adapter = btAdapter ?: return@runOnUiThread
                      adapter.cancelDiscovery()
                      val device = adapter.getRemoteDevice(address) ?: return@runOnUiThread
                      saveLastDevice(device)

                      if (hidDevice == null) {
                          ensureHidAndAutoConnect()
                          return@runOnUiThread
                      }

                      if (device.bondState != BluetoothDevice.BOND_BONDED) {
                          pendingDevice = device
                          device.createBond()
                          notifyWebStatus("CONNECTING", device.name ?: "Cihaz")
                      } else {
                          notifyWebStatus("CONNECTING", device.name ?: "Cihaz")
                          hidDevice?.connect(device)
                      }
                  }
              }

              private fun startNativeVoiceInput() {
                  runOnUiThread {
                      try {
                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                              putExtra(RecognizerIntent.EXTRA_PROMPT, "Konusun...")
                          }
                          startActivityForResult(intent, REQ_SPEECH)
                      } catch (e: Exception) {
                          Toast.makeText(this, "Sesli yazma desteklenmiyor", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_SPEECH && resultCode == RESULT_OK) {
                      val spoken = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull() ?: return
                      executor.execute {
                          if (connectedDevice == null) {
                              runOnUiThread { ensureHidAndAutoConnect() }
                              Thread.sleep(450)
                          }
                          sendTextViaHid(spoken)
                      }
                      val safe = spoken.replace("'", "\\'")
                      webView.evaluateJavascript("if(window.onNativeSpeechResult) window.onNativeSpeechResult('$safe');", null)
                  } else if (requestCode == REQ_ENABLE_BT && resultCode == RESULT_OK) {
                      ensureHidAndAutoConnect()
                  }
              }

              // Tüm HID Kanallarını (Klavye, Kumanda, Fare) Sıfırlar - Asılı kalan tuş/buton bırakmaz
              private fun releaseAllHidChannels() {
                  holdRepeatTask?.cancel(true)
                  holdRepeatTask = null
                  val dev = connectedDevice ?: return
                  executor.execute {
                      hidDevice?.sendReport(dev, 3, byteArrayOf(0, 0, 0, 0))
                      Thread.sleep(10)
                      hidDevice?.sendReport(dev, 1, byteArrayOf(0, 0, 0, 0, 0, 0, 0, 0))
                      Thread.sleep(10)
                      hidDevice?.sendReport(dev, 2, byteArrayOf(0, 0))
                  }
              }

              // Touchpad sonrasında Android TV'nin Touch Mode'dan çıkıp D-Pad Odağını geri almasını sağlar
              private fun wakeUpDpadFocusFromMouse() {
                  releaseAllHidChannels()
                  lastInputWasMouse = false
              }

              private fun startHoldKey(keyCode: Int) {
                  holdRepeatTask?.cancel(true)
                  holdRepeatTask = null
                  val dev = connectedDevice
                  if (dev == null) {
                      ensureHidAndAutoConnect()
                      return
                  }
                  executor.execute {
                      // Eğer öncesinde Touchpad/Mouse kullanıldıysa önce fareyi sıfırla
                      if (lastInputWasMouse) {
                          hidDevice?.sendReport(dev, 3, byteArrayOf(0, 0, 0, 0))
                          Thread.sleep(15)
                          lastInputWasMouse = false
                      }
                  }
                  val report = byteArrayOf(0, 0, keyCode.toByte(), 0, 0, 0, 0, 0)
                  holdRepeatTask = executor.scheduleWithFixedDelay({
                      val activeDev = connectedDevice ?: return@scheduleWithFixedDelay
                      hidDevice?.sendReport(activeDev, 1, report)
                  }, 15, 70, TimeUnit.MILLISECONDS)
              }

              private fun stopHoldKey() {
                  holdRepeatTask?.cancel(true)
                  holdRepeatTask = null
                  val dev = connectedDevice ?: return
                  executor.execute {
                      hidDevice?.sendReport(dev, 1, byteArrayOf(0, 0, 0, 0, 0, 0, 0, 0))
                  }
              }

              private fun sendKeyboardKey(modifier: Int, keyCode: Int) {
                  val dev = connectedDevice
                  if (dev == null) {
                      ensureHidAndAutoConnect()
                      return
                  }
                  executor.execute {
                      if (lastInputWasMouse) {
                          hidDevice?.sendReport(dev, 3, byteArrayOf(0, 0, 0, 0))
                          Thread.sleep(12)
                          lastInputWasMouse = false
                      }
                      hidDevice?.sendReport(dev, 1, byteArrayOf(modifier.toByte(), 0, keyCode.toByte(), 0, 0, 0, 0, 0))
                      Thread.sleep(22)
                      hidDevice?.sendReport(dev, 1, byteArrayOf(0, 0, 0, 0, 0, 0, 0, 0))
                      Thread.sleep(16)
                  }
              }

              private fun sendConsumerUsage(usage: Int) {
                  val dev = connectedDevice
                  if (dev == null) {
                      ensureHidAndAutoConnect()
                      return
                  }
                  executor.execute {
                      if (lastInputWasMouse) {
                          hidDevice?.sendReport(dev, 3, byteArrayOf(0, 0, 0, 0))
                          Thread.sleep(12)
                          lastInputWasMouse = false
                      }
                      val low = (usage and 0xFF).toByte()
                      val high = ((usage shr 8) and 0xFF).toByte()
                      hidDevice?.sendReport(dev, 2, byteArrayOf(low, high))
                      Thread.sleep(25)
                      hidDevice?.sendReport(dev, 2, byteArrayOf(0, 0))
                  }
              }

              private fun sendMouseReport(buttons: Int, dx: Int, dy: Int, wheel: Int) {
                  val dev = connectedDevice ?: return
                  lastInputWasMouse = true
                  executor.execute {
                      val cx = max(-127, min(127, dx)).toByte()
                      val cy = max(-127, min(127, dy)).toByte()
                      val cw = max(-127, min(127, wheel)).toByte()
                      hidDevice?.sendReport(dev, 3, byteArrayOf(buttons.toByte(), cx, cy, cw))
                      if (buttons != 0) {
                          Thread.sleep(24)
                          hidDevice?.sendReport(dev, 3, byteArrayOf(0, 0, 0, 0))
                      }
                  }
              }

              private fun sendTextViaHid(rawText: String) {
                  val trMap = mapOf(
                      'ç' to 'c', 'Ç' to 'C', 'ğ' to 'g', 'Ğ' to 'G',
                      'ı' to 'i', 'İ' to 'I', 'ö' to 'o', 'Ö' to 'O',
                      'ş' to 's', 'Ş' to 'S', 'ü' to 'u', 'Ü' to 'U'
                  )
                  val normalized = rawText.map { trMap[it] ?: it }.joinToString("")
                  for (ch in normalized) {
                      val pair = charToHid(ch)
                      if (pair != null) {
                          sendKeyboardKey(pair.first, pair.second)
                      }
                  }
              }

              private fun charToHid(c: Char): Pair<Int, Int>? {
                  return when (c) {
                      in 'a'..'z' -> Pair(0, (c - 'a') + 4)
                      in 'A'..'Z' -> Pair(2, (c - 'A') + 4)
                      in '1'..'9' -> Pair(0, (c - '1') + 30)
                      '0' -> Pair(0, 39)
                      ' ' -> Pair(0, 44)
                      '\n' -> Pair(0, 40)
                      '.' -> Pair(0, 55)
                      ',' -> Pair(0, 54)
                      '-' -> Pair(0, 45)
                      '?' -> Pair(2, 56)
                      '!' -> Pair(2, 30)
                      else -> null
                  }
              }

              inner class AndroidBridge {
                  @JavascriptInterface
                  fun startScan() = startLiveDiscovery()

                  @JavascriptInterface
                  fun stopScan() {
                      btAdapter?.cancelDiscovery()
                  }

                  @JavascriptInterface
                  fun connectDevice(address: String) = connectToAddress(address)

                  @JavascriptInterface
                  fun reconnectLast() = runOnUiThread { ensureHidAndAutoConnect() }

                  @JavascriptInterface
                  fun triggerPowerHybrid() {
                      // 1. Kızılötesi (IR) Güç Sinyalini Ateşle (Kapalı cihazı açmak için)
                      val savedIr = prefs.getInt("ir_profile_index", 0)
                      transmitIrProfile(savedIr, showToast = false)

                      // 2. Bağlıysa Bluetooth üzerinden de Güç komutu gönder, bağlı değilse otomatik bağlanmayı başlat
                      if (connectedDevice != null) {
                          sendConsumerUsage(48)
                      } else {
                          runOnUiThread { ensureHidAndAutoConnect() }
                      }
                  }

                  @JavascriptInterface
                  fun getSavedIrIndex(): Int {
                      return prefs.getInt("ir_profile_index", 0)
                  }

                  @JavascriptInterface
                  fun selectAndTestIr(index: Int) {
                      prefs.edit().putInt("ir_profile_index", index).apply()
                      transmitIrProfile(index, showToast = true)
                  }

                  @JavascriptInterface
                  fun sweepIrCodes() {
                      executor.execute {
                          for (i in 0 until 8) {
                              transmitIrProfile(i, showToast = false)
                              Thread.sleep(380)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun releaseAllHid() = releaseAllHidChannels()

                  @JavascriptInterface
                  fun recoverDpadFocus() = wakeUpDpadFocusFromMouse()

                  @JavascriptInterface
                  fun sendBackKey() {
                      // Hem Consumer AC Back (548) hem Klavye ESC (41) ile uyumlu geri komutu
                      sendConsumerUsage(548)
                  }

                  @JavascriptInterface
                  fun sendMenuKey() {
                      // Hem Consumer Menu (64) hem Klavye Context Menu (101) gönderir
                      sendConsumerUsage(64)
                      sendKeyboardKey(0, 101)
                  }

                  @JavascriptInterface
                  fun setGyroEnabled(enabled: Boolean) {
                      isGyroActive = enabled
                      runOnUiThread { registerGyroscope(enabled) }
                  }

                  @JavascriptInterface
                  fun setGyroSensitivity(sens: Float) {
                      gyroSensitivity = sens
                  }

                  @JavascriptInterface
                  fun startVoice() = startNativeVoiceInput()

                  @JavascriptInterface
                  fun sendText(text: String) = sendTextViaHid(text)

                  @JavascriptInterface
                  fun sendKey(keyCode: Int) = sendKeyboardKey(0, keyCode)

                  @JavascriptInterface
                  fun keyDown(keyCode: Int) = startHoldKey(keyCode)

                  @JavascriptInterface
                  fun keyUp(keyCode: Int) = stopHoldKey()

                  @JavascriptInterface
                  fun sendConsumer(usage: Int) = sendConsumerUsage(usage)

                  @JavascriptInterface
                  fun moveMouse(dx: Int, dy: Int, wheel: Int) = sendMouseReport(0, dx, dy, wheel)

                  @JavascriptInterface
                  fun clickMouse(button: Int) = sendMouseReport(button, 0, 0, 0)
              }
          }
          EOF

      - name: APK Derle ve Isimlendir
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk kumandarus.apk

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: kumandarus-APK
          path: kumandarus.apk
