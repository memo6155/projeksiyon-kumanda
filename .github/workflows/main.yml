                  <!-- Yaber Kumandadaki F- | Oto-Focus [+] | F+ Satırı -->
                  <div class="btn-row">
                    <button class="soft-btn" onclick="tapFocus(-1)">F- (Netlik)</button>
                    <button class="soft-btn focus-orange" onclick="tapFocus(0)">[ + ] Oto-Focus</button>
