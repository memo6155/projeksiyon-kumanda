            <!-- Akıllı IR Kod Bulucu Modal (64 Projeksiyon Kodu + Otomatik Tarayıcı) -->
            <div id="irModal" class="modal-backdrop">
              <div class="modal">
                <div class="modal-head">
                  <span class="modal-title">Yaber Ace K1 - Akıllı IR Bulucu</span>
                  <button class="close-x" onclick="closeIrModal()">✕</button>
                </div>
                <div id="irStatus" class="scan-info">
                  İpucu: Projeksiyon <b>AÇIKKEN</b> telefonu cihaza doğrultup <b>Otomatik Tara</b>'ya basın. Ekranda "Kapatılsın mı?" uyarısı çıktığı an durdurun!
                </div>

                <div class="scanner-box">
                  <div id="activeIrLabel" class="scanner-code">Kod #1 / 64</div>
                  <div class="scanner-controls">
                    <button class="soft-btn" onclick="stepIr(-1)">◀ Önceki</button>
                    <button id="autoScanBtn" class="soft-btn focus-orange" onclick="toggleAutoIrScan()">▶️ Otomatik Tara</button>
                    <button class="soft-btn" onclick="stepIr(1)">Sonraki ▶</button>
                  </div>
                  <button class="soft-btn" style="width:100%;background:#0284c7;color:#fff;" onclick="saveCurrentIr()">✅ Bu Kodu Güç Tuşuna Kaydet</button>
                </div>

                <div id="irList" class="dev-list"></div>
              </div>
            </div>

          <script>
            const foundDevices = {};
            let isConnected = false;
            let gyroEnabled = false;
            let selectedIrIndex = 0;
            let autoScanTimer = null;

            // Yaber Ace K1 ve Bu Kumanda Kasasını Kullanan Projeksiyonların 64'lü NEC IR Kod Tablosu
            const irDatabase = [
              // Grup 1: 0x00FF (Yaber / Wimius / Toptroe En Yaygın Kumanda Kodları)
              { name: "Yaber K1 Kod #1 (00FF - 0x0C)", b0: 0x00, b1: 0xFF, cmd: 0x0C },
              { name: "Yaber K1 Kod #2 (00FF - 0x08)", b0: 0x00, b1: 0xFF, cmd: 0x08 },
              { name: "Yaber K1 Kod #3 (00FF - 0x15)", b0: 0x00, b1: 0xFF, cmd: 0x15 },
              { name: "Yaber K1 Kod #4 (00FF - 0x45)", b0: 0x00, b1: 0xFF, cmd: 0x45 },
              { name: "Yaber K1 Kod #5 (00FF - 0x46)", b0: 0x00, b1: 0xFF, cmd: 0x46 },
              { name: "Yaber K1 Kod #6 (00FF - 0x47)", b0: 0x00, b1: 0xFF, cmd: 0x47 },
              { name: "Yaber K1 Kod #7 (00FF - 0x40)", b0: 0x00, b1: 0xFF, cmd: 0x40 },
              { name: "Yaber K1 Kod #8 (00FF - 0x10)", b0: 0x00, b1: 0xFF, cmd: 0x10 },
              { name: "Yaber K1 Kod #9 (00FF - 0x1C)", b0: 0x00, b1: 0xFF, cmd: 0x1C },
              { name: "Yaber K1 Kod #10 (00FF - 0x02)", b0: 0x00, b1: 0xFF, cmd: 0x02 },
              { name: "Yaber K1 Kod #11 (00FF - 0x12)", b0: 0x00, b1: 0xFF, cmd: 0x12 },
              { name: "Yaber K1 Kod #12 (00FF - 0x14)", b0: 0x00, b1: 0xFF, cmd: 0x14 },
              { name: "Yaber K1 Kod #13 (00FF - 0x18)", b0: 0x00, b1: 0xFF, cmd: 0x18 },
              { name: "Yaber K1 Kod #14 (00FF - 0x5A)", b0: 0x00, b1: 0xFF, cmd: 0x5A },
              { name: "Yaber K1 Kod #15 (00FF - 0x00)", b0: 0x00, b1: 0xFF, cmd: 0x00 },
              { name: "Yaber K1 Kod #16 (00FF - 0x01)", b0: 0x00, b1: 0xFF, cmd: 0x01 },
              { name: "Yaber K1 Kod #17 (00FF - 0x0D)", b0: 0x00, b1: 0xFF, cmd: 0x0D },
              { name: "Yaber K1 Kod #18 (00FF - 0x48)", b0: 0x00, b1: 0xFF, cmd: 0x48 },
              { name: "Yaber K1 Kod #19 (00FF - 0x57)", b0: 0x00, b1: 0xFF, cmd: 0x57 },
              { name: "Yaber K1 Kod #20 (00FF - 0x5E)", b0: 0x00, b1: 0xFF, cmd: 0x5E },
              { name: "Yaber K1 Kod #21 (00FF - 0x16)", b0: 0x00, b1: 0xFF, cmd: 0x16 },
              { name: "Yaber K1 Kod #22 (00FF - 0x19)", b0: 0x00, b1: 0xFF, cmd: 0x19 },
              { name: "Yaber K1 Kod #23 (00FF - 0x42)", b0: 0x00, b1: 0xFF, cmd: 0x42 },
              { name: "Yaber K1 Kod #24 (00FF - 0x52)", b0: 0x00, b1: 0xFF, cmd: 0x52 },
              { name: "Yaber K1 Kod #25 (00FF - 0x4A)", b0: 0x00, b1: 0xFF, cmd: 0x4A },
              { name: "Yaber K1 Kod #26 (00FF - 0x0A)", b0: 0x00, b1: 0xFF, cmd: 0x0A },
              { name: "Yaber K1 Kod #27 (00FF - 0x1A)", b0: 0x00, b1: 0xFF, cmd: 0x1A },
              { name: "Yaber K1 Kod #28 (00FF - 0x03)", b0: 0x00, b1: 0xFF, cmd: 0x03 },

              // Grup 2: 0x807F (Auto-Focus / F+ F- Kumandalı Linux/Android Projeksiyonlar)
              { name: "Yaber / AutoFocus #29 (807F - 0x12)", b0: 0x80, b1: 0x7F, cmd: 0x12 },
              { name: "Yaber / AutoFocus #30 (807F - 0x01)", b0: 0x80, b1: 0x7F, cmd: 0x01 },
              { name: "Yaber / AutoFocus #31 (807F - 0x02)", b0: 0x80, b1: 0x7F, cmd: 0x02 },
              { name: "Yaber / AutoFocus #32 (807F - 0x0C)", b0: 0x80, b1: 0x7F, cmd: 0x0C },
              { name: "Yaber / AutoFocus #33 (807F - 0x1A)", b0: 0x80, b1: 0x7F, cmd: 0x1A },
              { name: "Yaber / AutoFocus #34 (807F - 0x40)", b0: 0x80, b1: 0x7F, cmd: 0x40 },
              { name: "Yaber / AutoFocus #35 (807F - 0x46)", b0: 0x80, b1: 0x7F, cmd: 0x46 },
              { name: "Yaber / AutoFocus #36 (807F - 0x57)", b0: 0x80, b1: 0x7F, cmd: 0x57 },
              { name: "Yaber / AutoFocus #37 (807F - 0x08)", b0: 0x80, b1: 0x7F, cmd: 0x08 },
              { name: "Yaber / AutoFocus #38 (807F - 0x10)", b0: 0x80, b1: 0x7F, cmd: 0x10 },
              { name: "Yaber / AutoFocus #39 (807F - 0x1E)", b0: 0x80, b1: 0x7F, cmd: 0x1E },

              // Grup 3: 0x40BF (Amlogic / MStar / Smart Projeksiyon Anakartları)
              { name: "Smart Board #40 (40BF - 0x0B)", b0: 0x40, b1: 0xBF, cmd: 0x0B },
              { name: "Smart Board #41 (40BF - 0x02)", b0: 0x40, b1: 0xBF, cmd: 0x02 },
              { name: "Smart Board #42 (40BF - 0x10)", b0: 0x40, b1: 0xBF, cmd: 0x10 },
              { name: "Smart Board #43 (40BF - 0x12)", b0: 0x40, b1: 0xBF, cmd: 0x12 },
              { name: "Smart Board #44 (40BF - 0x40)", b0: 0x40, b1: 0xBF, cmd: 0x40 },
              { name: "Smart Board #45 (40BF - 0x01)", b0: 0x40, b1: 0xBF, cmd: 0x01 },
              { name: "Smart Board #46 (40BF - 0x45)", b0: 0x40, b1: 0xBF, cmd: 0x45 },
              { name: "Smart Board #47 (40BF - 0x0C)", b0: 0x40, b1: 0xBF, cmd: 0x0C },

              // Grup 4: 0x01FE & 0x02FD (HiSilicon / Mediatek Projeksiyonlar)
              { name: "Projeksiyon #48 (01FE - 0x40)", b0: 0x01, b1: 0xFE, cmd: 0x40 },
              { name: "Projeksiyon #49 (01FE - 0x45)", b0: 0x01, b1: 0xFE, cmd: 0x45 },
              { name: "Projeksiyon #50 (01FE - 0x50)", b0: 0x01, b1: 0xFE, cmd: 0x50 },
              { name: "Projeksiyon #51 (01FE - 0x01)", b0: 0x01, b1: 0xFE, cmd: 0x01 },
              { name: "Projeksiyon #52 (01FE - 0x12)", b0: 0x01, b1: 0xFE, cmd: 0x12 },
              { name: "Projeksiyon #53 (01FE - 0x10)", b0: 0x01, b1: 0xFE, cmd: 0x10 },
              { name: "Projeksiyon #54 (01FE - 0x08)", b0: 0x01, b1: 0xFE, cmd: 0x08 },
              { name: "Projeksiyon #55 (01FE - 0x18)", b0: 0x01, b1: 0xFE, cmd: 0x18 },
              { name: "Projeksiyon #56 (02FD - 0x45)", b0: 0x02, b1: 0xFD, cmd: 0x45 },
              { name: "Projeksiyon #57 (02FD - 0x48)", b0: 0x02, b1: 0xFD, cmd: 0x48 },
              { name: "Projeksiyon #58 (02FD - 0x10)", b0: 0x02, b1: 0xFD, cmd: 0x10 },

              // Grup 5: 0x10EF, 0x20DF, 0x04FB, Extended NEC
              { name: "Projeksiyon #59 (10EF - 0x40)", b0: 0x10, b1: 0xEF, cmd: 0x40 },
              { name: "Projeksiyon #60 (10EF - 0x12)", b0: 0x10, b1: 0xEF, cmd: 0x12 },
              { name: "Projeksiyon #61 (20DF - 0x10)", b0: 0x20, b1: 0xDF, cmd: 0x10 },
              { name: "Projeksiyon #62 (04FB - 0x08)", b0: 0x04, b1: 0xFB, cmd: 0x08 },
              { name: "Projeksiyon #63 (007F - 0x12)", b0: 0x00, b1: 0x7F, cmd: 0x12 },
              { name: "Projeksiyon #64 (007F - 0x40)", b0: 0x00, b1: 0x7F, cmd: 0x40 }
            ];

            const sensLevels = [
              { label: 'Yavaş', val: 14 },
              { label: 'Orta', val: 22 },
              { label: 'Hızlı', val: 32 }
            ];
            let sensIndex = 1;

            function vibrate(ms = 14) {
              if (navigator.vibrate) navigator.vibrate(ms);
            }

            function switchMode(mode) {
              vibrate(14);
              document.getElementById('tabRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('tabTouch').classList.toggle('active', mode === 'touch');
              document.getElementById('panelRemote').classList.toggle('active', mode === 'remote');
              document.getElementById('panelTouch').classList.toggle('active', mode === 'touch');

              if (mode === 'remote') {
                if (gyroEnabled) {
                  gyroEnabled = false;
                  updateGyroUi();
                }
                if (window.AndroidBridge) {
                  window.AndroidBridge.recoverDpadFocus();
                }
              } else {
                if (window.AndroidBridge) {
                  window.AndroidBridge.releaseAllHid();
                }
              }
            }

            function triggerHybridPower() {
              vibrate(30);
              const item = irDatabase[selectedIrIndex] || irDatabase[0];
              if (window.AndroidBridge) {
                window.AndroidBridge.triggerPowerWithIr(item.b0, item.b1, item.cmd);
              }
            }

            function tapFocus(dir) {
              vibrate(18);
              const item = irDatabase[selectedIrIndex] || irDatabase[0];
              if (window.AndroidBridge) {
                window.AndroidBridge.sendFocusCommand(dir, item.b0, item.b1);
              }
            }

            function tapBack() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendBackKey();
            }

            function tapMenu() {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendMenuKey();
            }

            function toggleGyroMouse() {
              gyroEnabled = !gyroEnabled;
              vibrate(22);
              updateGyroUi();
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroEnabled(gyroEnabled);
              }
            }

            function updateGyroUi() {
              const btn = document.getElementById('gyroBtn');
              const txt = document.getElementById('gyroText');
              const ring = document.getElementById('dpadRing');
              const sub = document.getElementById('okSubLabel');
              btn.classList.toggle('active', gyroEnabled);
              ring.classList.toggle('gyro-on', gyroEnabled);
              txt.textContent = gyroEnabled
                ? 'Sihirli İmleç: Açık (Hareket Ettirin)'
                : 'Sihirli İmleç (Jiroskop): Kapalı';
              sub.textContent = gyroEnabled ? 'SOL TIK' : '';
            }

            function cycleSensitivity() {
              sensIndex = (sensIndex + 1) % sensLevels.length;
              const item = sensLevels[sensIndex];
              vibrate(15);
              document.getElementById('sensBtn').textContent = 'Hız: ' + item.label;
              if (window.AndroidBridge) {
                window.AndroidBridge.setGyroSensitivity(item.val);
              }
            }

            function tapKey(code) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendKey(code);
            }

            function tapConsumer(usage) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendConsumer(usage);
            }

            function clickMouse(btn) {
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.clickMouse(btn);
            }

            function startVoice() {
              vibrate(25);
              if (window.AndroidBridge) window.AndroidBridge.startVoice();
            }

            function reconnectOrScan() {
              vibrate();
              if (!isConnected && window.AndroidBridge) {
                window.AndroidBridge.reconnectLast();
              } else {
                openScanner();
              }
            }

            function sendManualText() {
              const input = document.getElementById('manualText');
              const val = input.value;
              if (!val) {
                tapKey(40);
                return;
              }
              vibrate();
              if (window.AndroidBridge) window.AndroidBridge.sendText(val);
              input.value = '';
            }

            (function initHoldButtons() {
              document.querySelectorAll('[data-hold-key]').forEach((btn) => {
                const keyCode = parseInt(btn.getAttribute('data-hold-key'), 10);
                let active = false;

                const startHold = (e) => {
                  e.preventDefault();
                  if (active) return;
                  active = true;
                  btn.classList.add('pressed');
                  vibrate(14);
                  if (gyroEnabled) {
                    gyroEnabled = false;
                    updateGyroUi();
                    if (window.AndroidBridge) window.AndroidBridge.setGyroEnabled(false);
                  }
                  if (window.AndroidBridge) window.AndroidBridge.keyDown(keyCode);
                };

                const endHold = () => {
                  if (!active) return;
                  active = false;
                  btn.classList.remove('pressed');
                  if (window.AndroidBridge) window.AndroidBridge.keyUp(keyCode);
                };

                btn.addEventListener('touchstart', startHold, { passive: false });
                btn.addEventListener('touchend', endHold);
                btn.addEventListener('touchcancel', endHold);
                btn.addEventListener('mousedown', startHold);
                btn.addEventListener('mouseup', endHold);
                btn.addEventListener('mouseleave', endHold);
              });

              const okBtn = document.getElementById('okButton');
              let okActive = false;
              const startOk = (e) => {
                e.preventDefault();
                if (okActive) return;
                okActive = true;
                okBtn.classList.add('pressed');
                vibrate(16);
                if (gyroEnabled) {
                  clickMouse(1);
                } else if (window.AndroidBridge) {
                  window.AndroidBridge.keyDown(40);
                }
              };
              const endOk = () => {
                if (!okActive) return;
                okActive = false;
                okBtn.classList.remove('pressed');
                if (!gyroEnabled && window.AndroidBridge) {
                  window.AndroidBridge.keyUp(40);
                }
              };
              okBtn.addEventListener('touchstart', startOk, { passive: false });
              okBtn.addEventListener('touchend', endOk);
              okBtn.addEventListener('touchcancel', endOk);
              okBtn.addEventListener('mousedown', startOk);
              okBtn.addEventListener('mouseup', endOk);

              document.querySelectorAll('[data-hold-consumer]').forEach((btn) => {
                const usage = parseInt(btn.getAttribute('data-hold-consumer'), 10);
                let timer = null;

                const startRepeat = (e) => {
                  e.preventDefault();
                  btn.classList.add('pressed');
                  tapConsumer(usage);
                  clearInterval(timer);
                  timer = setInterval(() => tapConsumer(usage), 140);
                };

                const stopRepeat = () => {
                  btn.classList.remove('pressed');
                  clearInterval(timer);
                  timer = null;
                };

                btn.addEventListener('touchstart', startRepeat, { passive: false });
                btn.addEventListener('touchend', stopRepeat);
                btn.addEventListener('touchcancel', stopRepeat);
              });
            })();

            (function initTouchpad() {
              const surface = document.getElementById('touchSurface');
              const strip = document.getElementById('scrollStrip');
              let lastX = 0, lastY = 0, startX = 0, startY = 0, startTime = 0;
              let accX = 0, accY = 0, timer = null;

              surface.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                lastX = startX = t.clientX;
                lastY = startY = t.clientY;
                startTime = Date.now();
              }, { passive: true });

              surface.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                accX += (t.clientX - lastX) * 1.75;
                accY += (t.clientY - lastY) * 1.75;
                lastX = t.clientX;
                lastY = t.clientY;

                if (!timer) {
                  timer = setTimeout(() => {
                    const dx = Math.round(accX);
                    const dy = Math.round(accY);
                    accX = 0; accY = 0; timer = null;
                    if ((dx !== 0 || dy !== 0) && window.AndroidBridge) {
                      window.AndroidBridge.moveMouse(dx, dy, 0);
                    }
                  }, 14);
                }
              }, { passive: false });

              surface.addEventListener('touchend', () => {
                const dist = Math.hypot(lastX - startX, lastY - startY);
