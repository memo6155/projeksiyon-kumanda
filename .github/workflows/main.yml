                      <button class="btn" onclick="sendKey(4)">↩ Geri</button>
                      <button class="btn" onclick="sendKey(3)">⌂ Ev</button>
                      <button class="btn" onclick="sendKey(82)">≡ Menü</button>
                  </div>

                  <div class="btn-grid">
                      <button class="btn" onclick="sendKey(24)">🔊 Ses +</button>
                      <button class="btn" onclick="sendKey(25)">🔉 Ses -</button>
                      <button class="btn" onclick="sendKey(164)">🔇 Sessiz</button>
                  </div>

