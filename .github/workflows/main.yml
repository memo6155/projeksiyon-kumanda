              private fun buildRedmiSafeNecPattern(b0: Int, b1: Int, cmd: Int): IntArray {
                  val invCmd = (cmd.inv()) and 0xFF
                  val pattern = IntArray(68)
                  pattern[0] = 9000
                  pattern[1] = 4500
                  var idx = 2
                  val bytes = intArrayOf(b0 and 0xFF, b1 and 0xFF, cmd and 0xFF, invCmd)
                  for (b in bytes) {
                      for (bit in 0 until 8) {
                          pattern[idx++] = 560
                          pattern[idx++] = if (((b shr bit) and 1) == 1) 1690 else 560
                      }
                  }
                  pattern[66] = 560
                  pattern[67] = 20000
                  return pattern
              }

              private fun hasIrEmitter(): Boolean = irManager?.hasIrEmitter() == true

              private fun transmitNec(b0: Int, b1: Int, cmd: Int) {
                  val ir = irManager
                  if (ir == null || !ir.hasIrEmitter()) return
                  executor.execute {
                      try {
                          val pattern = buildRedmiSafeNecPattern(b0, b1, cmd)
                          ir.transmit(38000, pattern)
                          Thread.sleep(95)
                          ir.transmit(38000, pattern)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun registerGyroscope(enable: Boolean) {
                  val sm = sensorManager ?: return
                  val sensor = gyroSensor ?: return
                  if (enable) {
                      remX = 0f
                      remY = 0f
                      lastGyroTs = 0L
                      sm.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  } else {
                      sm.unregisterListener(this)
                      releaseAllHidChannels()
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (!isGyroActive || event?.sensor?.type != Sensor.TYPE_GYROSCOPE) return
                  if (connectedDevice == null) return

                  // Hiz, ornekleme frekansindan bagimsiz olsun: dt ile olceklendir
                  val dt = if (lastGyroTs == 0L) 0.02f
                           else ((event.timestamp - lastGyroTs) / 1_000_000_000f).coerceIn(0.001f, 0.05f)
                  lastGyroTs = event.timestamp
                  val scale = gyroSensitivity * 50f * dt   // 50 Hz'de eski davranisla ayni

                  val rotX = event.values[0]
                  val rotZ = event.values[2]

                  val deadzone = 0.035f
                  val cleanZ = if (abs(rotZ) < deadzone) 0f else rotZ
                  val cleanX = if (abs(rotX) < deadzone) 0f else rotX
                  if (cleanZ == 0f && cleanX == 0f) return

                  val rawDx = (-cleanZ * scale) + remX
                  val rawDy = (-cleanX * scale) + remY

                  val dx = rawDx.roundToInt()
                  val dy = rawDy.roundToInt()

                  remX = rawDx - dx
                  remY = rawDy - dy

                  if (dx != 0 || dy != 0) {
                      sendMouseReport(0, dx, dy, 0, 0)
                  }
              }

