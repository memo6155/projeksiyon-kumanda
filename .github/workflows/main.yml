              private fun autoReconnectToSaved(pluggedDevice: BluetoothDevice? = null) {
                  val adapter = btAdapter ?: return
                  val proxy = hidDevice ?: return

                  val current = try { proxy.connectedDevices.firstOrNull() } catch (_: Exception) { null }
                  if (current != null) {
                      connectedDevice = current
                      notifyWebStatus("CONNECTED", current.name ?: "Cihaz")
                      return
                  }

                  val savedAddr = prefs.getString("last_addr", null)
                  val target: BluetoothDevice? = when {
                      !savedAddr.isNullOrBlank() -> adapter.bondedDevices?.firstOrNull { it.address == savedAddr }
                      pluggedDevice != null && pluggedDevice.bondState == BluetoothDevice.BOND_BONDED -> pluggedDevice
                      else -> null
                  }

                  if (target != null) {
                      notifyWebStatus("CONNECTING", target.name ?: "Cihaz")
                      proxy.connect(target)
                  } else {
                      syncUiConnectionState()
                  }
              }

              private fun syncUiConnectionState() {
