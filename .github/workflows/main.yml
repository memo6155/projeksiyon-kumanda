          cat << 'EOF' > filter/src/main/java/com/k1/screenfilter/FilterService.kt
          package com.k1.screenfilter

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.ServerSocket
          import kotlin.concurrent.thread

          class FilterService : Service() {

              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var serverSocket: ServerSocket? = null
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  initOverlayView()
                  startHttpServer()
              }

              private fun startAsForeground() {
                  val channelId = "k1_filter_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "K1 Filter Service", NotificationManager.IMPORTANCE_LOW)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("K1 Screen Filter")
                          .setContentText("Arka plan filtre servisi devrede (Port 8088)")
                          .setSmallIcon(android.R.drawable.ic_menu_manage)
                          .build()
                  } else {
                      Notification.Builder(this)
                          .setContentTitle("K1 Screen Filter")
                          .setContentText("Arka plan filtre servisi devrede (Port 8088)")
                          .setSmallIcon(android.R.drawable.ic_menu_manage)
                          .build()
                  }
                  startForeground(101, notification)
              }

              private fun initOverlayView() {
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_SYSTEM_OVERLAY
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                  }

                  overlayView = View(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                  }
                  try {
                      windowManager?.addView(overlayView, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun updateFilterColor(brightness: Int, warmth: Int) {
                  mainHandler.post {
                      val view = overlayView ?: return@post
                      if (brightness == 100 && warmth == 0) {
                          view.setBackgroundColor(Color.TRANSPARENT)
                          return@post
                      }

                      if (brightness < 100) {
                          // Karartma (Dimmer): Siyah katman opakligi
                          val factor = (100 - brightness) / 70.0
                          val alpha = (factor * 200).toInt().coerceIn(0, 220)
                          if (warmth > 0) {
                              view.setBackgroundColor(Color.argb(alpha, 35, 20, 5))
                          } else {
                              view.setBackgroundColor(Color.argb(alpha, 0, 0, 0))
                          }
                      } else {
                          // Aydinlatma (Shadow Boost): Yari saydam beyaz
                          val factor = (brightness - 100) / 50.0
                          val alpha = (factor * 80).toInt().coerceIn(0, 95)
                          if (warmth > 0) {
                              view.setBackgroundColor(Color.argb(alpha, 255, 240, 180))
                          } else {
                              view.setBackgroundColor(Color.argb(alpha, 255, 255, 255))
                          }
                      }
                  }
              }

              private fun startHttpServer() {
                  thread(isDaemon = true) {
                      try {
                          serverSocket = ServerSocket(8088)
                          while (!Thread.currentThread().isInterrupted) {
                              val client = serverSocket?.accept() ?: break
                              thread {
                                  try {
                                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                      val line = reader.readLine() ?: return@thread
                                      if (line.startsWith("GET /filter")) {
                                          val query = line.substringAfter("?", "").substringBefore(" ")
                                          var b = 100
                                          var w = 0
                                          query.split("&").forEach { param ->
                                              val parts = param.split("=")
                                              if (parts.size == 2) {
                                                  if (parts[0] == "b") b = parts[1].toIntOrNull() ?: 100
                                                  if (parts[0] == "w") w = parts[1].toIntOrNull() ?: 0
                                              }
                                          }
                                          updateFilterColor(b, w)
                                      }
                                      val response = "HTTP/1.1 200 OK\r\nAccess-Control-Allow-Origin: *\r\nContent-Type: text/plain\r\nContent-Length: 2\r\n\r\nOK"
                                      client.getOutputStream().write(response.toByteArray())
                                  } catch (_: Exception) {}
                                  finally {
                                      try { client.close() } catch (_: Exception) {}
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { serverSocket?.close() } catch (_: Exception) {}
                  if (overlayView != null && windowManager != null) {
                      try { windowManager?.removeView(overlayView) } catch (_: Exception) {}
                  }
              }
          }
          EOF

