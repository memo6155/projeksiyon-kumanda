name: Kumandarus APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Kumandarus Projesini Olustur
        run: |
          rm -rf index.html app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kumandarus/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kumandarus"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kumandarus.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kumandarus.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          # Özel Kumandarus Logo Arka Planı
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF0F172A"/>
                          <item android:offset="0.5" android:color="#FF1E1B4B"/>
                          <item android:offset="1.0" android:color="#FF0284C7"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          # Özel Kumandarus Logo Ön Planı
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.8"
                  android:strokeLineCap="round"
                  android:pathData="M43,27 C49,21 59,21 65,27" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#7DD3FC"
                  android:strokeWidth="2.4"
                  android:strokeLineCap="round"
                  android:pathData="M37,22 C46,13 62,13 71,22" />
              <path
                  android:fillColor="#1E293B"
                  android:strokeColor="#E2E8F0"
                  android:strokeWidth="2.5"
                  android:pathData="M42,32 L66,32 A8,8 0 0,1 74,40 L74,76 A8,8 0 0,1 66,84 L42,84 A8,8 0 0,1 34,76 L34,40 A8,8 0 0,1 42,32 Z" />
              <path
                  android:fillColor="#0F172A"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.2"
                  android:pathData="M54,42 A11,11 0 1,1 53.9,42 Z" />
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M54,49 A4,4 0 1,1 53.9,49 Z" />
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M43,69 A2.5,2.5 0 1,1 42.9,69 Z" />
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M54,69 A3.2,3.2 0 1,1 53.9,69 Z" />
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M65,69 A2.5,2.5 0 1,1 64.9,69 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.TRANSMIT_IR" />

              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />
              <uses-feature android:name="android.hardware.consumerir" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="kumandarus"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/assets/kumandarus.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>kumandarus</title>
          <style>
            * {
              box-sizing: border-box;
              margin: 0;
              padding: 0;
              user-select: none;
              -webkit-user-select: none;
              -webkit-touch-callout: none;
              -webkit-tap-highlight-color: transparent;
            }
            body {
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              background: radial-gradient(circle at 50% 0%, #172033 0%, #0b0e14 70%);
              color: #f1f5f9;
              height: 100vh;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              padding: 10px 14px 12px;
              overflow: hidden;
            }
            svg {
              width: 19px;
              height: 19px;
              stroke: currentColor;
              stroke-width: 2;
              stroke-linecap: round;
              stroke-linejoin: round;
              fill: none;
              flex-shrink: 0;
            }

            /* Üst Bar */
            .header {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 6px;
            }
            .icon-pill {
              width: 42px;
              height: 42px;
              border-radius: 13px;
              background: rgba(30, 41, 59, 0.65);
              border: 1px solid rgba(255, 255, 255, 0.07);
              color: #cbd5e1;
              display: flex;
              align-items: center;
              justify-content: center;
              transition: transform 0.1s, background 0.15s;
              font-size: 11px;
              font-weight: 800;
            }
            .icon-pill:active {
              transform: scale(0.92);
              background: rgba(51, 65, 85, 0.9);
            }
            .icon-pill.power {
              color: #f87171;
              border-color: rgba(248, 113, 113, 0.3);
            }
            .icon-pill.ir-btn {
              color: #fb923c;
              border-color: rgba(251, 146, 60, 0.3);
              width: auto;
              padding: 0 10px;
              gap: 4px;
            }
            .status-pill {
              flex: 1;
              height: 42px;
              border-radius: 13px;
              background: rgba(30, 41, 59, 0.65);
              border: 1px solid rgba(255, 255, 255, 0.07);
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 7px;
              padding: 0 10px;
              overflow: hidden;
            }
            .status-pill:active {
              background: rgba(51, 65, 85, 0.85);
            }
            .dot {
              width: 8px;
              height: 8px;
              border-radius: 50%;
              background: #ef4444;
              flex-shrink: 0;
              transition: all 0.25s;
            }
            .dot.connecting {
              background: #f59e0b;
              box-shadow: 0 0 8px #f59e0b;
            }
            .dot.connected {
              background: #10b981;
              box-shadow: 0 0 8px #10b981;
            }
            #statusText {
              font-size: 12px;
              font-weight: 600;
              color: #e2e8f0;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            }

            /* LG Sihirli Kumanda (Jiroskop) Çubuğu */
            .gyro-bar {
              display: flex;
              align-items: center;
              gap: 8px;
              margin-top: 6px;
            }
            .gyro-btn {
              flex: 1;
              height: 36px;
              border-radius: 11px;
              background: rgba(30, 41, 59, 0.6);
              border: 1px solid rgba(56, 189, 248, 0.2);
              color: #cbd5e1;
              font-size: 12px;
              font-weight: 600;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 7px;
              transition: all 0.18s;
            }
            .gyro-btn.active {
              background: linear-gradient(135deg, rgba(14, 165, 233, 0.28), rgba(37, 99, 235, 0.35));
              border-color: #38bdf8;
              color: #38bdf8;
              box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
            }
            .sens-pill {
              height: 36px;
              padding: 0 10px;
              border-radius: 11px;
              background: rgba(30, 41, 59, 0.6);
              border: 1px solid rgba(255, 255, 255, 0.07);
              color: #94a3b8;
              font-size: 11px;
              font-weight: 700;
            }

            /* Orta Gövde */
            .main-stage {
              flex: 1;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              min-height: 0;
              margin: 4px 0;
            }
            .stage-panel {
              display: none;
              width: 100%;
              height: 100%;
              flex-direction: column;
              justify-content: space-evenly;
              align-items: center;
            }
            .stage-panel.active {
              display: flex;
            }

            /* Modern Dairesel D-Pad */
            .dpad-ring {
              position: relative;
              width: 204px;
              height: 204px;
              border-radius: 50%;
              background: linear-gradient(145deg, #161e2e, #0f1420);
              border: 1px solid rgba(255, 255, 255, 0.08);
              box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.06);
              display: flex;
              align-items: center;
              justify-content: center;
            }
            .dpad-ring.gyro-on {
              border-color: rgba(56, 189, 248, 0.45);
              box-shadow: 0 0 28px rgba(56, 189, 248, 0.18);
            }
            .d-btn {
              position: absolute;
              background: transparent;
              border: none;
              color: #94a3b8;
              display: flex;
              align-items: center;
              justify-content: center;
            }
            .d-btn svg {
              width: 24px;
              height: 24px;
              stroke-width: 2.4;
            }
            .d-btn.pressed, .d-btn:active {
              color: #38bdf8;
              background: rgba(56, 189, 248, 0.12);
            }
            .d-up { top: 5px; left: 52px; width: 100px; height: 60px; border-radius: 36px 36px 12px 12px; }
            .d-down { bottom: 5px; left: 52px; width: 100px; height: 60px; border-radius: 12px 12px 36px 36px; }
            .d-left { left: 5px; top: 52px; width: 60px; height: 100px; border-radius: 36px 12px 12px 36px; }
            .d-right { right: 5px; top: 52px; width: 60px; height: 100px; border-radius: 12px 36px 36px 12px; }
            .d-ok {
              width: 78px;
              height: 78px;
              border-radius: 50%;
              background: linear-gradient(145deg, #1e293b, #111827);
              border: 1px solid rgba(255, 255, 255, 0.1);
              box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45);
              color: #f8fafc;
              font-size: 14px;
              font-weight: 700;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
            }
            .d-ok small {
              font-size: 9px;
              font-weight: 500;
              color: #38bdf8;
              margin-top: 2px;
            }
            .d-ok.pressed, .d-ok:active {
              transform: scale(0.94);
              background: #0284c7;
              color: #fff;
            }

            /* Yardımcı Kumanda Tuşları (Geri, Home, Menü + F-, Oto-Focus, F+ + Ses) */
            .control-rows {
              width: 100%;
              display: flex;
              flex-direction: column;
              gap: 6px;
            }
            .btn-row {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              gap: 8px;
            }
            .soft-btn {
              height: 40px;
              border-radius: 12px;
              background: rgba(30, 41, 59, 0.55);
              border: 1px solid rgba(255, 255, 255, 0.06);
              color: #e2e8f0;
              font-size: 12px;
              font-weight: 600;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 5px;
            }
            .soft-btn.focus-orange {
              color: #fb923c;
              border-color: rgba(251, 146, 60, 0.3);
            }
            .soft-btn.pressed, .soft-btn:active {
              transform: scale(0.95);
              background: rgba(56, 189, 248, 0.18);
              border-color: rgba(56, 189, 248, 0.4);
              color: #fff;
            }

            /* Touchpad Alanı */
            .touchpad-wrap {
              width: 100%;
              flex: 1;
              display: flex;
              gap: 8px;
              margin-bottom: 8px;
              min-height: 150px;
            }
            .touch-surface {
              flex: 1;
              background: rgba(15, 23, 42, 0.75);
              border: 1px solid rgba(255, 255, 255, 0.08);
              border-radius: 18px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              color: #64748b;
              font-size: 13px;
              gap: 6px;
              text-align: center;
              padding: 16px;
              touch-action: none;
            }
            .scroll-bar {
              width: 44px;
              background: rgba(30, 41, 59, 0.5);
              border: 1px solid rgba(255, 255, 255, 0.06);
              border-radius: 18px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: space-between;
              padding: 14px 0;
              color: #64748b;
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 1px;
              touch-action: none;
            }
            .mouse-row {
              width: 100%;
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 10px;
            }

            /* OK Tuşlarının Altındaki 3'lü Bar: Kumanda | Mikrofon | Touchpad */
            .mode-dock {
              display: grid;
              grid-template-columns: 1fr auto 1fr;
              align-items: center;
              gap: 10px;
              background: rgba(15, 23, 42, 0.85);
              border: 1px solid rgba(255, 255, 255, 0.07);
              padding: 5px 8px;
              border-radius: 18px;
              margin-bottom: 6px;
            }
            .dock-tab {
              height: 42px;
              border-radius: 13px;
              border: none;
              background: transparent;
              color: #94a3b8;
              font-size: 13px;
              font-weight: 600;
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 6px;
            }
            .dock-tab.active {
              background: rgba(56, 189, 248, 0.15);
              color: #38bdf8;
            }
            .mic-center-btn {
              width: 48px;
              height: 48px;
              border-radius: 50%;
              border: none;
              background: linear-gradient(135deg, #0284c7, #2563eb);
              color: #ffffff;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
            }
            .mic-center-btn:active {
              transform: scale(0.92);
            }

            /* Alt Klavye / Metin Çubuğu */
            .keyboard-bar {
              display: flex;
              gap: 8px;
              background: rgba(30, 41, 59, 0.55);
              border: 1px solid rgba(255, 255, 255, 0.06);
              padding: 5px;
              border-radius: 13px;
            }
            .kb-input {
              flex: 1;
              background: transparent;
              border: none;
              padding: 7px 10px;
              color: #f8fafc;
              font-size: 13px;
              outline: none;
              min-width: 0;
            }
            .kb-input::placeholder { color: #64748b; }
            .kb-btn {
              background: rgba(51, 65, 85, 0.7);
              color: #e2e8f0;
              border: none;
              border-radius: 9px;
              padding: 0 12px;
              font-size: 13px;
              font-weight: 600;
            }
            .kb-btn.send {
              background: #0284c7;
              color: #fff;
            }

            /* Modaller */
            .modal-backdrop {
              position: fixed;
              inset: 0;
              background: rgba(5, 8, 14, 0.86);
              backdrop-filter: blur(4px);
              display: none;
              align-items: center;
              justify-content: center;
              padding: 14px;
              z-index: 100;
            }
            .modal-backdrop.open { display: flex; }
            .modal {
              width: 100%;
              max-width: 380px;
              background: #141c2b;
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 20px;
              padding: 15px;
              max-height: 86vh;
              display: flex;
              flex-direction: column;
            }
            .modal-head {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
            }
            .modal-title { font-size: 15px; font-weight: 700; color: #f8fafc; }
            .close-x {
              width: 30px;
              height: 30px;
              border-radius: 8px;
              border: none;
              background: rgba(255,255,255,0.07);
              color: #cbd5e1;
              font-size: 15px;
            }
            .scan-info {
              font-size: 12px;
              color: #38bdf8;
              margin-bottom: 8px;
              line-height: 1.35;
            }
            .scanner-box {
              background: rgba(15, 23, 42, 0.9);
              border: 1px solid rgba(251, 146, 60, 0.35);
              border-radius: 14px;
              padding: 10px;
              margin-bottom: 10px;
            }
            .scanner-code {
              font-size: 13px;
              font-weight: 700;
              color: #fb923c;
              text-align: center;
              margin-bottom: 8px;
            }
            .scanner-controls {
              display: grid;
              grid-template-columns: 1fr 1.6fr 1fr;
              gap: 6px;
              margin-bottom: 6px;
            }
            .dev-list {
              flex: 1;
              overflow-y: auto;
              display: flex;
              flex-direction: column;
              gap: 6px;
              min-height: 120px;
              margin-bottom: 10px;
            }
            .dev-card {
              background: rgba(15, 23, 42, 0.8);
              border: 1px solid rgba(255, 255, 255, 0.06);
              border-radius: 11px;
              padding: 9px 11px;
              display: flex;
              justify-content: space-between;
              align-items: center;
            }
            .dev-card.selected {
              border-color: #fb923c;
              background: rgba(251, 146, 60, 0.14);
            }
            .dev-title { font-size: 12px; font-weight: 600; color: #f1f5f9; }
            .dev-mac { font-size: 11px; color: #64748b; margin-top: 2px; }
            .dev-tag {
              font-size: 10px;
              padding: 4px 7px;
              border-radius: 6px;
              background: rgba(56, 189, 248, 0.12);
              color: #38bdf8;
              font-weight: 700;
            }
          </style>
          </head>
          <body>

            <!-- Üst Bar -->
            <div class="header">
              <button class="icon-pill power" onclick="triggerHybridPower()" title="Güç (Kızılötesi + Bluetooth)">
                <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
              </button>

              <button class="icon-pill ir-btn" onclick="openIrModal()" title="Kızılötesi (IR) Bulucu">
                <span>IR BUL</span>
              </button>

              <div class="status-pill" onclick="reconnectOrScan()">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">Bağlı Değil</span>
              </div>

              <button class="icon-pill" onclick="openScanner()" title="Bluetooth Cihazlar">
                <svg viewBox="0 0 24 24"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
              </button>
            </div>

            <!-- LG Sihirli Kumanda (Jiroskop Air Mouse) Çubuğu -->
            <div class="gyro-bar">
              <button id="gyroBtn" class="gyro-btn" onclick="toggleGyroMouse()">
                <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
                <span id="gyroText">Sihirli İmleç (Jiroskop): Kapalı</span>
              </button>
