name: Kumandarus ve K1 Filter APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Kumandarus ve K1 Filter Projelerini Olustur
        run: |
          rm -rf index.html app filter
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/kumandarus/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          mkdir -p filter/src/main/java/com/k1/screenfilter
          mkdir -p filter/src/main/res/drawable
          mkdir -p filter/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Kumandarus"
          include ':app', ':filter'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # ==================== APP MODULU (KUMANDARUS) ====================
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.kumandarus.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kumandarus.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 13
                  versionName "13.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF0F172A"/>
                          <item android:offset="0.5" android:color="#FF1E1B4B"/>
                          <item android:offset="1.0" android:color="#FF0284C7"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.8"
                  android:strokeLineCap="round"
                  android:pathData="M43,27 C49,21 59,21 65,27" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="2.8"
                  android:strokeLineCap="round"
                  android:pathData="M48,32 C51,28 57,28 60,32" />
              <path
                  android:fillColor="#FF1E293B"
                  android:strokeColor="#0284C7"
                  android:strokeWidth="3.2"
                  android:pathData="M38,37 L70,37 A7,7 0 0 1 77,44 L77,87 A7,7 0 0 1 70,94 L38,94 A7,7 0 0 1 31,87 L31,44 A7,7 0 0 1 38,37 Z" />
              <path
                  android:fillColor="#FF0284C7"
                  android:pathData="M54,43 A3.5,3.5 0 1 0 54,50 A3.5,3.5 0 1 0 54,43 Z" />
              <path
