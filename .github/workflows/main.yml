              // Projeksiyonların parazit filtresini aşmak için Repeat Frame zorunludur
              private fun buildFullNecPattern(b0: Int, b1: Int, cmd: Int): IntArray {
                  val invCmd = (cmd.inv()) and 0xFF
                  val list = ArrayList<Int>(76)
                  // 1. Ana NEC Çerçevesi
                  list.add(9000)
                  list.add(4500)
                  val bytes = intArrayOf(b0 and 0xFF, b1 and 0xFF, cmd and 0xFF, invCmd)
                  for (b in bytes) {
                      for (bit in 0 until 8) {
                          list.add(560)
                          if (((b shr bit) and 1) == 1) {
                              list.add(1690)
                          } else {
                              list.add(560)
                          }
                      }
                  }
                  list.add(560)
                  list.add(40000)
                  // 2. NEC Repeat Pulse (Fiziksel tuş basımı onayı)
                  list.add(9000)
                  list.add(2250)
                  list.add(560)
                  list.add(96000)
                  return list.toIntArray()
              }

              private fun transmitNec(b0: Int, b1: Int, cmd: Int) {
                  val ir = irManager
                  if (ir == null || !ir.hasIrEmitter()) {
                      runOnUiThread {
                          Toast.makeText(this, "Kizilotesi (IR) verici bulunamadi", Toast.LENGTH_SHORT).show()
                      }
                      return
                  }
                  executor.execute {
                      try {
                          val pattern = buildFullNecPattern(b0, b1, cmd)
                          ir.transmit(38000, pattern)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

