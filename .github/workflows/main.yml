          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/drawable/* filter/src/main/res/drawable/
          cp app/src/main/res/mipmap-anydpi-v26/* filter/src/main/res/mipmap-anydpi-v26/

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.TRANSMIT_IR" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Kumandarus"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ==================== FILTER MODULU (K1 FILTER v2.0 - OTO AYDINLATMA) ====================
          cat << 'EOF' > filter/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.k1.screenfilter'
              compileSdk 34

              defaultConfig {
                  applicationId "com.k1.screenfilter"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

          cat << 'EOF' > filter/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="K1 Screen Filter"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FilterService"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > filter/src/main/java/com/k1/screenfilter/BootReceiver.kt
          package com.k1.screenfilter

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val serviceIntent = Intent(context, FilterService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > filter/src/main/java/com/k1/screenfilter/MainActivity.kt
          package com.k1.screenfilter

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 1234)
                  } else {
                      startFilterService()
                  }
              }

              private fun startFilterService() {
                  val serviceIntent = Intent(this, FilterService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  Toast.makeText(this, "K1 Filtre Servisi Devrede! Port: 8088", Toast.LENGTH_LONG).show()
                  finish()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1234) {
                      startFilterService()
                  }
              }
          }
          EOF

          cat << 'EOF' > filter/src/main/java/com/k1/screenfilter/FilterService.kt
          package com.k1.screenfilter

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.View
          import android.view.WindowManager
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.ServerSocket
          import java.net.Socket
          import kotlin.concurrent.thread

          class FilterService : Service() {

              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var serverSocket: ServerSocket? = null
              private var isRunning = true

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(1001, buildNotification())
                  initOverlayView()
                  startHttpServer()
                  startAutoRecTvWatcher()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "filter_channel",
                          "K1 Filter Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, "filter_channel")
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  return builder
                      .setContentTitle("K1 Screen Filter")
                      .setContentText("K1 Canli Ekran Parlaklik ve Kontrast Modu Devrede")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build()
              }

              private fun initOverlayView() {
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  overlayView = View(this)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_SYSTEM_OVERLAY
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )

                  overlayView?.setBackgroundColor(Color.TRANSPARENT)
                  try {
                      windowManager?.addView(overlayView, params)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              // boost > 0: Karanlik tonlari ve golgeleri aydinlatma modu (White Shadow-Wash)
              private fun updateFilterColor(brightness: Int, warmth: Int, boost: Int) {
                  overlayView?.post {
                      if (boost > 0) {
                          // Beyaz yikama filtresi (Koyu sahneleri aydinlatir)
                          val alpha = (boost * 0.75).toInt().coerceIn(0, 110)
                          overlayView?.setBackgroundColor(Color.argb(alpha, 255, 255, 255))
                      } else {
                          val bClamped = brightness.coerceIn(0, 100)
                          val wClamped = warmth.coerceIn(0, 100)

                          val alphaDim = ((100 - bClamped) * 2.2).toInt().coerceIn(0, 220)
                          val alphaWarm = (wClamped * 0.9).toInt().coerceIn(0, 90)

                          val r = if (wClamped > 0) 255 else 0
                          val g = if (wClamped > 0) 140 else 0
                          val b = 0
                          val combinedAlpha = (alphaDim + alphaWarm).coerceIn(0, 230)

                          if (combinedAlpha <= 0) {
                              overlayView?.setBackgroundColor(Color.TRANSPARENT)
                          } else {
                              overlayView?.setBackgroundColor(Color.argb(combinedAlpha, r, g, b))
                          }
                      }
                  }
              }

              // REC TV'yi otomatik algilayip karanlik sahneleri canli aydinlatan izleyici
              private fun startAutoRecTvWatcher() {
                  thread {
                      var lastState = false
                      while (isRunning) {
                          try {
                              val process = Runtime.getRuntime().exec(arrayOf("sh", "-c", "dumpsys window 2>/dev/null | grep -m 1 mCurrentFocus"))
                              val reader = BufferedReader(InputStreamReader(process.inputStream))
                              val focus = reader.readLine() ?: ""
                              process.waitFor()

                              val isRecTv = focus.contains("com.rectv.shot")
                              if (isRecTv != lastState) {
                                  lastState = isRecTv
                                  if (isRecTv) {
                                      // REC TV acildi -> Otomatik golge aydinlatma modunu baslat (boost=40)
                                      updateFilterColor(100, 0, 40)
                                  } else {
                                      // REC TV'den cikildi -> Normale dondur
                                      updateFilterColor(100, 0, 0)
                                  }
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                          Thread.sleep(1500)
                      }
                  }
              }

              private fun startHttpServer() {
                  thread {
                      try {
                          serverSocket = ServerSocket(8088)
                          while (isRunning) {
                              val client = serverSocket?.accept() ?: break
                              handleClient(client)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun handleClient(client: Socket) {
                  thread {
                      try {
                          val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                          val line = reader.readLine() ?: ""

                          if (line.startsWith("GET /filter")) {
                              var b = 100
                              var w = 0
                              var boost = 0

                              val query = line.substringAfter("?", "").substringBefore(" ")
                              val params = query.split("&")
                              for (p in params) {
                                  val kv = p.split("=")
                                  if (kv.size == 2) {
                                      when (kv[0]) {
                                          "b" -> b = kv[1].toIntOrNull() ?: 100
                                          "w" -> w = kv[1].toIntOrNull() ?: 0
                                          "boost" -> boost = kv[1].toIntOrNull() ?: 0
                                      }
                                  }
                              }

                              updateFilterColor(b, w, boost)

                              val response = "HTTP/1.1 200 OK\r\nAccess-Control-Allow-Origin: *\r\nContent-Type: text/plain\r\nContent-Length: 2\r\n\r\nOK"
                              client.getOutputStream().write(response.toByteArray())
                              client.getOutputStream().flush()
                          }
                          client.close()
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {
                  isRunning = false
                  try {
                      serverSocket?.close()
                      if (overlayView != null) {
                          windowManager?.removeView(overlayView)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # ==================== KUMANDARUS MainActivity ve HTML (Mevcut hali korunur) ====================
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="tr">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
              <title>Kumandarus</title>
              <style>
