                  body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; }
                  .title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
                  .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 9999px; font-weight: 600; text-transform: uppercase; background: #ef4444; color: #fff; }
                  .badge.connected { background: #10b981; }
